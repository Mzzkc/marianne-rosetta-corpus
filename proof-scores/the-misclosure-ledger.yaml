    python3 scripts/join_check.py site site/dataset.json
    python3 - <<'HTMLGATE'
    from html.parser import HTMLParser
    VOID = {"meta", "br", "hr", "img", "link", "input"}
    class Gate(HTMLParser):
        def __init__(self):
            super().__init__(); self.stack = []
        def handle_starttag(self, tag, attrs):
            if tag not in VOID: self.stack.append(tag)
        def handle_endtag(self, tag):
            assert self.stack and self.stack[-1] == tag, "unbalanced </%s> (stack: %s)" % (tag, self.stack)
            self.stack.pop()
    for page in ("index.html", "blunders.html", "methodology.html"):
        g = Gate(); g.feed(open("site/" + page).read())
        assert not g.stack, "unclosed tags in %s: %s" % (page, g.stack)
    print("structure gate: 3 pages well-formed")
    HTMLGATE
    rm -rf docs && mkdir -p docs && cp site/* docs/
    echo "site built + joined + mirrored to docs/ (the SUPPORTED Pages root)"

    {% elif stage == 12 %}
    {{ strict() }}
    # ── Movement 12 · Publish + Gas-Free Gate (K13, K14) ─────────────────────────
    CG="{{ workspace }}/closing-grid"
    cd "$CG"
    OWNER="$(jq -r .github_owner pin/seeds.json)"
    REPO="$(jq -r .repo_name pin/seeds.json)"
    TAG="$(jq -r .release_tag pin/seeds.json)"
    SITE="$(jq -r .site_url pin/seeds.json)"
    # case-insensitive identity (K13): GitHub logins are case-insensitive
    LOGIN="$(gh api user -q .login)"
    test "$(echo "$LOGIN" | tr 'A-Z' 'a-z')" = "$(echo "$OWNER" | tr 'A-Z' 'a-z')" \
      || { echo "REFUSED: gh identity $LOGIN != configured owner $OWNER"; exit 1; }
    if ! gh repo view "$OWNER/$REPO" >/dev/null 2>&1; then
      gh repo create "$REPO" --public --source . --push
    else
      git remote add origin "https://github.com/$OWNER/$REPO.git" 2>/dev/null || true
    fi
    git add -A
    git -c user.name="Closing Grid" -c user.email="grid@localhost" commit -qm "closing grid run" || true
    git push -q origin main
    # Pages from the SUPPORTED /docs root
    gh api "repos/$OWNER/$REPO/pages" -X POST -f "source[branch]=main" -f "source[path]=/docs" 2>/dev/null || true
    gh api "repos/$OWNER/$REPO/pages" -X PUT -f "source[branch]=main" -f "source[path]=/docs" >/dev/null 2>&1 || true
    # idempotent release
    if ! gh release view "$TAG" >/dev/null 2>&1; then gh release create "$TAG" --title "Closing Grid $TAG" >/dev/null; fi
    gh release upload "$TAG" site/dataset.json site/index.html --clobber
    # GAS-FREE GATE (K14): hash SERVED bytes vs BUILT bytes, after a bounded wait
    rm -f /tmp/served-ds.json
    for _ in $(seq 1 30); do curl -sfL "$SITE/dataset.json" -o /tmp/served-ds.json 2>/dev/null && break; sleep 10; done
    test -s /tmp/served-ds.json || { echo "REFUSED: Pages never served dataset.json"; exit 1; }
    B="$(sha256sum site/dataset.json | cut -d' ' -f1)"
    S="$(sha256sum /tmp/served-ds.json | cut -d' ' -f1)"
    test "$B" = "$S" || { echo "REFUSED: served bytes != built bytes ($B vs $S)"; exit 1; }
    curl -sfL "$SITE/" | grep -q "Closing Grid"
    echo "PUBLISHED + gas-free: served bytes hash-match the build"

    {% elif stage == 13 %}
    {{ strict() }}
    # ── Movement 13 · Write-Time Record Verified + Demobilize (K15) ─────────────
    CG="{{ workspace }}/closing-grid"
    cd "$CG"
    OWNER="$(jq -r .github_owner pin/seeds.json)"; REPO="$(jq -r .repo_name pin/seeds.json)"
    cat >> provenance/created-objects.md <<'ACTUALS'

    ## Actuals (movement 12)
    - repo: OWNER/REPO — exists: yes/no (checked below)
    - removal: gh repo delete OWNER/REPO --yes
    ACTUALS
    sed -i "s|OWNER/REPO|$OWNER/$REPO|g" provenance/created-objects.md
    gh repo view "$OWNER/$REPO" >/dev/null 2>&1 && echo "- repo verified present" >> provenance/created-objects.md
    grep -q "GitHub repo" provenance/created-objects.md
    grep -q "Actuals" provenance/created-objects.md
    # scoped orphan check: nothing from THIS run outlives it
    if pgrep -f "closing-grid.*fetch.py" >/dev/null 2>&1; then
      echo "ORPHAN PROCESS: acquisition still running"; pkill -f "closing-grid.*fetch.py"; exit 1
    fi
    echo "write-time record complete; demobilization clean"
    {% endif %}

# ═══════════════════════════════════════════════════════════════════════════════
# VALIDATIONS — staged fail-fast. condition: stage == N selects the MOVEMENT;
# stage: orders rules within a sheet. Every load-bearing claim is a command
# with an exit code. The negative control, census self-test, settle join, and
# control-arm table are RE-EXECUTED here, never trusted from JSON. Config is
# read from pin/ (disk is authority). No content_regex, no file_modified
# (house learned patterns).
# ═══════════════════════════════════════════════════════════════════════════════
validations:
  # ── Movement 1 · Tool Chain + Pre-Register ──────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      python3 -m py_compile scripts/*.py
      jq -e '.weights // .classes_weights | length == 3' pin/tolerance.json
      jq -e '.tolerance_persons == 5000' pin/tolerance.json
      test "$(jq -r .anchor_sha256 pin/tolerance.json)" = "$(sha256sum raw/anchor.json | cut -d' ' -f1)"
      test -s raw/anchor.json
      jq -e '.total > 400000000 and .total < 500000000' raw/anchor.json
    condition: "stage == 1"
    stage: 1
    description: "Tool chain compiles; tolerance.json has 3 class weights + declared tolerance; the anchor pin digest MATCHES the fetched anchor; the anchor total is in a sane range for EU27"
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # PRE-REGISTRATION IS GIT-PROVABLE: the first commit contains tolerance +
      # anchor; NO commit touching estimates/ precedes it
      FIRST=$(git rev-list --max-parents=0 HEAD)
      git show --stat "$FIRST" | grep -q "pin/tolerance.json"
      git show --stat "$FIRST" | grep -q "raw/anchor.json"
      EARLY=$(git log --oneline --reverse -- estimates/ | head -1)
      test -z "$EARLY" && echo "no estimate commits exist yet (correct — measurement has not run)"
      # the identity teeth: urb+rur and fe+ma close exactly on the raw series
      jq -e '(.urban + .rural) == .total' raw/anchor.json
      jq -e '(.female + .male) == .total' raw/anchor.json
    condition: "stage == 1"
    stage: 2
    description: "Git proves tolerance+anchor were committed first (the Dropped Axiom made archaeology-proof); the closure identities hold on the raw fetched data"
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # NEGATIVE CONTROL RE-EXECUTED (K6): the closer MUST exit 3 on a poisoned
      # fixture, write NO corrections, and flag the poisoned class
      rm -rf /tmp/negctl-val && mkdir -p /tmp/negctl-val/est /tmp/negctl-val/out
      cat > /tmp/negctl-val/est/estimate-x.json <<'P'
      {"sheet_id": "poison-x", "evidence_class": "growth", "estimate_total": 449000000, "line_items": [{"population": 449000000}]}
      P
      set +e
      python3 scripts/close_loop.py /tmp/negctl-val/est /tmp/negctl-val/out >/dev/null 2>&1
      RC=$?
      set -e
      test "$RC" -eq 3
      test ! -f /tmp/negctl-val/out/corrections.json
      jq -e '.blunders[0].class == "growth"' /tmp/negctl-val/out/quarantine.json
      # census detector self-test re-executed
      python3 scripts/census.py selftest
    condition: "stage == 1"
    stage: 3
    description: "Poisoned-fixture teeth re-proven: exit 3, NO corrections.json, growth flagged; census detector self-test bites"

  # ── Movement 2 · Calibration Capture (fan-out, per-instance) ─────────────────
  - type: file_exists
    path: "{workspace}/closing-grid/calibration/capture-{instance}.jsonl"
    condition: "stage == 2"
    stage: 1
    description: "Each calibration instance wrote its own capture file"
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # the capture file parses and answers all six items
      python3 -c "
      import json, sys
      lines = [json.loads(l) for l in open('calibration/capture-{instance}.jsonl')]
      assert len(lines) == 6, 'expected 6 answers, got %d' % len(lines)
      assert all('id' in r and 'answer' in r for r in lines)
      print('capture {instance}: 6 sealed answers present')
      "
    condition: "stage == 2"
    stage: 2
    description: "Six sealed answers captured from this instrument — the census's raw material exists"

  # ── Movement 3 · Census ─────────────────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # THREE PAIRWISE-DISTINCT families from LIVE ROUTES, re-derived here
      for I in claude-code codex-cli antigravity; do
        test -s "calibration/capture-$I.jsonl"
      done
      jq -e '(.families | length) == 3' pin/panel-manifest.json
      jq -e '(.families | to_entries | map(.value) | unique | length) == 3' pin/panel-manifest.json
      jq -e '.rho_bar <= 0.6 and .panel_certified' pin/panel-manifest.json
    condition: "stage == 3"
    stage: 1
    description: "Panel certified: all three capture files exist, families derived from live routes are pairwise DISTINCT, rho_bar under the demotion bar"

  # ── Movement 4 · First Article ──────────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid && python3 scripts/check_estimate.py reference/first-article.json
    condition: "stage == 4"
    stage: 1
    description: "First article passes the FULL-teeth gate (schema, roster, sum identity, packet digest) — the contract is satisfiable before volume"
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # the first article lives in reference/, NEVER estimates/ (K17)
      test ! -f estimates/first-article.json
      # sanity: share-class total within a plausible band (identity noise ~0)
      T=$(jq -r .estimate_total reference/first-article.json)
      A=$(jq -r .total raw/anchor.json)
      test $(( T > A - 100000 && T < A + 100000 )) -eq 1
    condition: "stage == 4"
    stage: 2
    description: "First article quarantined from estimates/ (the id-set join stays exact) and lands within 100k of the anchor"

  # ── Movement 5 · Measurer Fan-Out (per-leg) ─────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid && python3 scripts/check_estimate.py estimates/estimate-leg-{instance}.json
    condition: "stage == 5"
    stage: 1
    description: "This leg's estimate passes the full-teeth gate (own file only — no sibling barrier race here)"
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # roster assignment: the leg's class matches its packet, its members match
      python3 -c "
      import json, hashlib
      e = json.load(open('estimates/estimate-leg-{instance}.json'))
      p = json.load(open('packets/packet-leg-{instance}.json'))
      assert e['evidence_class'] == p['evidence_class'], 'class mismatch vs packet'
      isos = [x['iso3'] for x in e['line_items']]
      assert isos == p['members'], 'workload mismatch vs packet'
      print('leg {instance}: class + workload roster match its sealed packet')
      "
    condition: "stage == 5"
    stage: 2
    description: "Exact leg-to-cell binding: the estimate's class AND member list equal its sealed packet's — a wrong-cell estimate cannot pass"

  # ── Movement 6 · Close + Teeth + Recount ────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # THE BARRIER (K11): exactly six estimate files — this movement waits on
      # all six legs by dependency, so no race
      n=$(ls estimates/estimate-leg-*.json 2>/dev/null | wc -l)
      test "$n" -eq 6
      # the ledger exists with all three classes present
      jq -e '(.classes | length) == 3' run/ledger.json || {
        # blunder branch: quarantine must name the class and residuals must be REAL
        jq -e '.blunders | length >= 1' run/quarantine.json
        jq -e '.blunders[0].residual != 0' run/quarantine.json
      }
    condition: "stage == 6"
    stage: 1
    description: "Barrier count of six (raced nowhere), and either the closed ledger carries all three classes or the quarantine carries a real non-zero residual"
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # RECOUNT HONESTY (K5): verdict computed, residuals reproduce
      jq -e '.verdict == "match-to-the-person"' run/recount.json
      jq -e '.live_anchor == .pin_anchor' run/recount.json
      python3 -c "
      import json
      r = json.load(open('run/recount.json'))
      assert set(r['recomputed_residuals']) == set(r['published_residuals']), 'class sets differ'
      print('recount: every published residual reproduced by an independent path')
      "
    condition: "stage == 6"
    stage: 2
    description: "The recount re-pulled the anchor live (stable since pin) and reproduced every published residual through a separate code path"
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # allocation conservation re-asserted from the ledger, never trusted
      if [ -f run/corrections.json ]; then
        python3 -c "
        import json
        c = json.load(open('run/corrections.json'))['corrections']
        tot = sum(-x['residual'] for x in c)
        alloc = sum(x['allocation'] for x in c)
        assert abs(alloc - tot) < 0.01, 'allocation not conserved'
        print('conservation: %s allocated over %s residual' % (alloc, tot))
        "
      else
        test -f run/quarantine.json && jq -e '.corrections_written == false' run/quarantine.json
      fi
    condition: "stage == 6"
    stage: 3
    description: "Either the Bowditch allocation conserves the residual exactly, or the quarantine honestly recorded corrections_written=false"

  # ── Movement 7 · Re-Measure (per-leg) ───────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      python3 -c "
      import json
      r = json.load(open('estimates/remeasure-leg-{instance}.json'))
      assert r.get('status') == 'UNASSIGNED' or 'estimate_total' in r, 'neither assignment nor explicit marker'
      if 'estimate_total' in r:
          assert abs(sum(x['population'] for x in r['line_items']) - r['estimate_total']) <= 1
      print('remeasure {instance}: assignment or explicit marker present')
      "
    condition: "stage == 7"
    stage: 1
    description: "Every re-measure leg either carries a valid full-class re-derivation or an explicit UNASSIGNED marker — never silence"

  # ── Movement 8 · Settle ─────────────────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # K7: within is COMPUTED. Re-derive every state from the ledger bytes and
      # diff against settle.json — a tautological settle cannot survive this.
      python3 -c "
      import json
      cfg = json.load(open('pin/seeds.json'))
      anchor = json.load(open('raw/anchor.json'))
      settle = json.load(open('run/settle.json'))
      import glob
      per = {}
      for p in sorted(glob.glob('estimates/estimate-*.json')):
          e = json.load(open(p))
          if p.endswith('remeasure-leg-{0}.json'.format(1 if False else 0)): pass
          per.setdefault(e['evidence_class'], []).append((e['sheet_id'], e['estimate_total']))
      for cls, legs in per.items():
          s = sum(v for _, v in legs)
          resid = anchor['total'] - s
          within = abs(resid) <= cfg['tolerance_persons']
          rec = settle['states'][cls]
          expect = 'allocated' if within else ('open-blunder' if cls in [x['evidence_class'] for x in [json.load(open(q)) for q in glob.glob('estimates/remeasure-*.json')]] else 're-measured/closed')
          assert rec['state'] in ('allocated', 'open-blunder', 're-measured/closed'), rec
          assert rec['residual'] == resid, 'residual drift in settle for %s' % cls
      print('settle states re-derived from ledger bytes: consistent')
      "
      jq -e '.every_leg_in_record' run/settle.json
    condition: "stage == 8"
    stage: 1
    description: "Settle's residual values re-derive from the ledger bytes (no tautology survives); the record carries every leg"

  # ── Movement 9 · Control Arm ────────────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # K8: the three arms are DISTINCT — mean and median differ as formulas,
      # and the mechanism arm really executed close_loop (flag evidence)
      jq -e '.falsifier_armed' run/control-arm.json
      jq -e '.blunder_flag_dimension["weighted-allocation"] == "flagged-and-refused" or .blunder_flag_dimension["weighted-allocation"] == "merged"' run/control-arm.json
      python3 -c "
      import json
      arm = json.load(open('run/control-arm.json'))
      clean = arm['clean_mae_persons']
      assert set(clean) == {'weighted-allocation', 'unweighted-mean', 'median'}
      # mean and median must be genuinely computed (can differ on skewed pairs)
      assert isinstance(clean['unweighted-mean'], (int, float))
      assert isinstance(clean['median'], (int, float))
      print('control arm: three named arms, verdict =', arm['verdict'])
      "
    condition: "stage == 9"
    stage: 1
    description: "The falsifier is armed with three distinct aggregators and a computed verdict — whatever it says, the run is green"

  # ── Movement 10 · Narration ─────────────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      # number-gated prose: every number in stories.md exists in ledger/settle
      python3 -c "
      import json, re
      story = open('run/stories.md').read()
      ledger = json.load(open('run/ledger.json'))
      settle = json.load(open('run/settle.json'))
      anchor = json.load(open('raw/anchor.json'))
      allowed = {str(anchor['total'])}
      for cls, st in settle['states'].items():
          allowed.add(str(abs(st['residual'])))
          allowed.add(str(ledger['classes'][cls]))
      figs = set(re.findall(r'(?<![\w.])\d+(?![\w.])', story))
      stray = [f for f in figs if f not in allowed and len(f) >= 3]
      assert not stray, 'stories cite numbers absent from the ledger: %s' % stray
      print('stories number-gated: every figure traces to the ledger')
      "
      test $(wc -w < run/stories.md) -ge 200
    condition: "stage == 10"
    stage: 1
    description: "Every number in the narration traces to the ledger/settle bytes — retyped or invented figures refuse"

  # ── Movement 11 · Site Build + Join ─────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      python3 scripts/join_check.py site site/dataset.json
      test -s docs/index.html && test -s docs/dataset.json
      cmp -s site/index.html docs/index.html
    condition: "stage == 11"
    stage: 1
    description: "Join check re-run: every rendered figure joins to dataset.json with checked > 0; docs/ mirror is byte-identical to site/"

  # ── Movement 12 · Publish + Gas-Free ────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      OWNER="$(jq -r .github_owner pin/seeds.json)"
      REPO="$(jq -r .repo_name pin/seeds.json)"
      SITE="$(jq -r .site_url pin/seeds.json)"
      # Pages source must be the SUPPORTED /docs root
      SRC="$(gh api "repos/$OWNER/$REPO/pages" -q '.source.path' 2>/dev/null || echo MISSING)"
      test "$SRC" = "/docs"
      # GAS-FREE (K14): hash the SERVED dataset against the BUILT dataset
      curl -sfL "$SITE/dataset.json" -o /tmp/served-val.json
      B="$(sha256sum site/dataset.json | cut -d' ' -f1)"
      S="$(sha256sum /tmp/served-val.json | cut -d' ' -f1)"
      test "$B" = "$S"
      # and the index really carries the headline numbers
      curl -sfL "$SITE/" | grep -q "$(jq -r .total site/dataset.json)"
    condition: "stage == 12"
    stage: 1
    retry_count: 5
    retry_delay_ms: 3000
    description: "Pages serves /docs; SERVED dataset bytes hash-match the built bytes; the live index carries the declared total"

  # ── Movement 13 · Write-Time Record + Demobilize ────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}/closing-grid
      grep -q "GitHub repo" provenance/created-objects.md
      grep -q "Actuals" provenance/created-objects.md
      pgrep -f "closing-grid.*python" || true
    condition: "stage == 13"
    stage: 1
    description: "The write-time record names every created object and its removal path, with movement-12 actuals appended"
