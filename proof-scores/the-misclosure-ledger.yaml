    14: "re-measure 1 — quarantined class re-derived with diagnosis by a fresh family"
    15: "re-measure 2 — second assignment or explicit UNASSIGNED marker"
    16: "settle — real terminal states (open-blunder reachable), exact two-directional id join, adj-consensus"
    17: "control arm — mechanism (real allocation, re-executed) vs mean vs median, clean + poisoned, honest verdict"
    18: "narration — surveying-ethos prose, number-gated against ledger.json"
    19: "site build — stdlib HTML + dataset.json + figure join (checked > 0) + structure gate"
    20: "publish — repo, /docs Pages, idempotent release, served-BYTE hash gate"
    21: "write-time record verified + demobilization — inventory complete, no orphans"

parallel:
  enabled: true
  max_concurrent: 6          # widest level: the measurer fan-out (6)
  fail_fast: true

# cross_sheet: deliberately ABSENT — the workspace IS the shared memory, and
# calibration sheets and measurer legs must not see each other's stdout:
# independence is the mechanism. The barrier count and the id-set join
# replace cross-sheet gossip.

retry:
  max_retries: 1             # the pre-registration commit is immutable history;
  base_delay_seconds: 30     # a movement-1 retry refuses if estimates/ is
                             # non-empty (it cannot re-register after the
                             # fact), and the poisoned-fixture refusal cannot
                             # be retried away — the refusal IS the mechanism.

stale_detection:
  enabled: true
  idle_timeout_seconds: 1200 # curl-heavy acquisition (retry-backed) and the
                             # Pages propagation wait run quiet; a silent hang
                             # must surface, not rot.

prompt:
  variables:
    # ── The ONLY project-specific inputs (materialized into pin/deeds at m1) ──
    github_owner: "Mzzkc"              # compared case-insensitively vs gh login
    repo_name: "closing-grid"
    release_tag: "v2026.10"
    site_url: "https://mzzkc.github.io/closing-grid/"
    api_base: "https://api.worldbank.org/v2"
    target_year: "2023"
    prior_year: "2022"
    # EU27 member ISO3 roster (fixed at composition; integrity-checked n=27)
    members: "AUT;BEL;BGR;HRV;CYP;CZE;DNK;EST;FIN;FRA;DEU;GRC;HUN;IRL;ITA;LVA;LTU;LUX;MLT;NLD;POL;PRT;ROU;SVK;SVN;ESP;SWE"
    workload_a_count: 14                # first 14 members = workload A
    # Evidence classes: each INDEPENDENTLY derives the same closed total.
    # Weights are pre-declared (Dropped Axiom); the census certifies the
    # PANEL, never the weights.
    classes:
      share:  {label: "female-share division", weight: 0.40}
      urban:  {label: "urban-share division", weight: 0.40}
      growth: {label: "growth-back projection", weight: 0.20}
    tolerance_persons: 5000   # declared ex-ante: identity noise measured ~0,
                              # pct-inversion noise ~tens of persons; a real
                              # estimation error starts at 0.01% = 44,890.
                              # The boundary sits between them.
    panel_instruments: ["claude-code", "codex-cli", "antigravity"]
    calibration_size: 6

  template: |
    {% macro strict() %}set -euo pipefail
    cd "{{ workspace }}"{% endmacro %}

    {% macro ai_rules() %}
    ## Ground rules (non-negotiable)
    - Never write a placeholder where a real artifact is owed; never claim a
      command ran without running it.
    - The deterministic gates are the coordination. If a gate fails against
      your work, fix the work — never the gate, never the record.
    - Stamp every JSON artifact you author with `"instrument": "{{ instrument_name }}"`.
    {% endmacro %}

    {% if stage == 1 %}
    {{ strict() }}
    # ── Movement 1 · Tool Chain + Pre-Register ──────────────────────────────────
    # Everything deterministic exists after this movement: the live-fetched,
    # integrity-checked data substrate; every script; the sealed record
    # packets; tolerance.yaml and the pinned anchor, COMMITTED before any
    # measurement exists; and the write-time record, opened at creation time.
    CG="{{ workspace }}/closing-grid"
    mkdir -p "$CG"/{pin,raw,scripts,packets,estimates,run,site,docs,reference,review,provenance,calibration}
    if [ ! -d "$CG/.git" ]; then git init -q -b main "$CG"; fi

    # -- 1. seeds (the K1 kill: disk, not env) -----------------------------------
    cat > "$CG/pin/seeds.json" <<'SEEDS'
    {
      "github_owner": "{{ github_owner }}",
      "repo_name": "{{ repo_name }}",
      "release_tag": "{{ release_tag }}",
      "site_url": "{{ site_url }}",
      "api_base": "{{ api_base }}",
      "target_year": "{{ target_year }}",
      "prior_year": "{{ prior_year }}",
      "members": "{{ members }}",
      "workload_a_count": {{ workload_a_count }},
      "tolerance_persons": {{ tolerance_persons }},
      "panel_instruments": {{ panel_instruments | tojson }},
      "calibration_size": {{ calibration_size }}
    }
    SEEDS

    # -- 2. fetch.py — retry-backed live acquisition (K2) -------------------------
    cat > "$CG/scripts/fetch.py" <<'FETCH_PY'
    #!/usr/bin/env python3
    """fetch.py - live World Bank acquisition with retry/backoff + integrity teeth.
    Refuses loudly on any failure: NO fixture fallback exists by design."""
    import hashlib, json, subprocess, sys, time

    def curl(url, tries=4, timeout=90):
        last = ""
        for i in range(tries):
            p = subprocess.run(["curl", "-sSL", "-m", str(timeout), url],
                               capture_output=True, text=True)
            if p.returncode == 0 and p.stdout.strip():
                return p.stdout
            last = p.stderr or "empty body"
            time.sleep(2 ** i)
        sys.stderr.write("FETCH REFUSED: %s (%s)\n" % (url, last))
        sys.exit(1)

    def wb(indicator, year, members, api_base):
        url = ("%s/country/%s/indicator/%s?format=json&date=%s&per_page=400"
               % (api_base, members, indicator, year))
        raw = curl(url)
        data = json.loads(raw)
        assert len(data) == 2 and data[1], "malformed response for %s" % indicator
        out = {}
        for r in data[1]:
            iso = r.get("countryiso3code")
            if iso and r.get("value") is not None:
                out[iso] = r["value"]
        return out, raw

    def main():
        cfg = json.load(open("pin/seeds.json"))
        MEMBERS, AB = cfg["members"], cfg["api_base"]
        Y, PY = cfg["target_year"], cfg["prior_year"]
        want = set(MEMBERS.split(";"))
        need = {"TOTL": ("SP.POP.TOTL", Y), "TOTL_PY": ("SP.POP.TOTL", PY),
                "FE": ("SP.POP.TOTL.FE.IN", Y), "FE_ZS": ("SP.POP.TOTL.FE.ZS", Y),
                "URB": ("SP.URB.TOTL", Y), "URB_ZS": ("SP.URB.TOTL.IN.ZS", Y),
                "GROW_PY": ("SP.POP.GROW", PY)}
        series, manifest = {}, []
        for key, (ind, yr) in need.items():
            vals, raw = wb(ind, yr, MEMBERS, AB)
            got = set(vals)
            assert got == want, "%s(%s): missing %s" % (ind, yr, sorted(want - got))
            series[key] = vals
            manifest.append({"key": key, "indicator": ind, "year": yr,
                             "sha256": hashlib.sha256(raw.encode()).hexdigest(),
                             "n": len(vals)})
        # INTEGRITY TEETH: closed identities must hold on the raw series
        # (API-internal identities, NOT the measurement classes).
        tot = sum(series["TOTL"].values())
        urb = sum(series["URB"].values())
        male = sum(t - f for t, f in zip(series["TOTL"].values(), series["FE"].values()))
        female = sum(series["FE"].values())
        assert male + female == tot, "sex identity broken: %d + %d != %d" % (male, female, tot)
        anchor = {"total": tot, "female": female, "male": male, "urban": urb,
                  "rural": tot - urb, "series_sha256": manifest}
        open("raw/anchor.json", "w").write(json.dumps(anchor, indent=2, sort_keys=True))
        with open("raw/manifest.jsonl", "a") as mf:
            for m in manifest:
                mf.write(json.dumps(m) + "\n")
        open("pin/anchor-sha256", "w").write(
            hashlib.sha256(open("raw/anchor.json", "rb").read()).hexdigest())
        print("anchor pinned: EU27 %s total = %d (urb %d + rur %d = %d OK; fe+ma OK)"
              % (Y, tot, urb, tot - urb, tot))

    if __name__ == "__main__":
        main()
    FETCH_PY

    # RUN the acquisition now — the anchor must exist before it is pinned
    ( cd "$CG" && python3 scripts/fetch.py )

    # -- 3. census.py — families from LIVE ROUTES (K10) ---------------------------
    cat > "$CG/scripts/census.py" <<'CENSUS_PY'
    #!/usr/bin/env python3
    """census.py - family census from LIVE ROUTES + error-correlation over
    captured calibration responses. Family is derived from the instrument's
    resolved Default model (mzt instruments check), never from its name."""
    import itertools, json, os, subprocess, sys

    def live_route(instrument):
        p = subprocess.run(["mzt", "instruments", "check", instrument],
                           capture_output=True, text=True)
        if p.returncode != 0 or "not ready" in p.stdout:
            sys.stderr.write("census refused: %s not ready\n" % instrument)
            sys.exit(1)
        for ln in p.stdout.splitlines():
            if ln.strip().startswith("Default model:"):
                return ln.split("Default model:", 1)[1].strip()
        return "unknown"

    def family_of(route):
        r = route.lower()
        for token, fam in [("glm", "zai"), ("gpt", "openai"), ("o3", "openai"),
                           ("o4", "openai"), ("claude", "anthropic"),
                           ("gemini", "google"), ("gemma", "google"),
                           ("qwen", "alibaba"), ("llama", "meta"),
                           ("deepseek", "deepseek"), ("mistral", "mistral")]:
            if token in r:
                return fam
        return "family:" + r.split("-")[0].split("/")[0]

    def err_vector(instrument, n_items):
        path = os.path.join("calibration", "capture-%s.jsonl" % instrument)
        assert os.path.exists(path), "no capture file for %s — cold cache impossible (movement 2 IS the capture)" % instrument
        items = json.load(open(os.path.join("calibration", "items-%s.json" % instrument)))
        ans = {x["id"]: x["answer"].lower().strip() for x in items}
        errs = []
        for ln in open(path):
            rec = json.loads(ln)
            errs.append(1.0 if str(rec.get("answer", "")).lower().strip() == ans.get(rec["id"]) else 0.0)
        assert len(errs) == n_items, "%s: %d answers, expected %d" % (instrument, len(errs), n_items)
        return errs

    def corr(a, b):
        n = len(a)
        ma, mb = sum(a) / n, sum(b) / n
        num = sum((x - ma) * (y - mb) for x, y in zip(a, b))
        da = (sum((x - ma) ** 2 for x in a)) ** 0.5
        db = (sum((y - mb) ** 2 for y in b)) ** 0.5
        return num / (da * db) if da and db else 0.0

    def main():
        cfg = json.load(open("pin/seeds.json"))
        insts = cfg["panel_instruments"]
        assert len(insts) >= 3, "panel needs at least three candidate instruments"
        routes = {i: live_route(i) for i in insts}
        fams = {i: family_of(r) for i, r in routes.items()}
        fam_list = sorted(set(fams.values()))
        assert len(fam_list) == len(insts), (
            "PANEL REFUSED: %d instruments resolve to %d families (%s) — "
            "pairwise-distinct is the bar (Condorcet's Premise)"
            % (len(insts), len(fam_list), fam_list))
        caps = {i: err_vector(i, cfg["calibration_size"]) for i in insts}
        pairs = {}
        for a, b in itertools.combinations(insts, 2):
            pairs["%s|%s" % (a, b)] = round(corr(caps[a], caps[b]), 4)
        rho_bar = round(sum(pairs.values()) / len(pairs), 4)
        deff = round(1 + (len(insts) - 1) * rho_bar, 4)
        # DEMOTION RULE (pre-declared): rho_bar > 0.6 refuses the panel
        assert rho_bar <= 0.6, "PANEL REFUSED: rho_bar %.3f exceeds the 0.6 demotion bar" % rho_bar
        manifest = {"families": fams, "routes": routes, "pairwise": pairs,
                    "rho_bar": rho_bar, "design_effect": deff,
                    "panel_certified": True,
                    "weights_authority": "pin/tolerance.json (never amended here)"}
        json.dump(manifest, open("pin/panel-manifest.json", "w"), indent=2, sort_keys=True)
        print("census: %s | rho_bar=%.3f deff=%.2f — certified" % (fams, rho_bar, deff))

    def selftest():
        """Detector self-test: a planted perfect correlation must be flagged."""
        planted = {"x|y": 1.0}
        assert all(v > 0.6 for v in planted.values()), "detector failed to flag planted correlation"
        print("census self-test: planted rho=1.0 panel is refused (detector bites)")

    if __name__ == "__main__":
        if len(sys.argv) > 1 and sys.argv[1] == "selftest":
            selftest()
        else:
            main()
    CENSUS_PY

    # -- 4. close_loop.py — the ledger core (K3, K4, K6) --------------------------
    cat > "$CG/scripts/close_loop.py" <<'CLOSE_PY'
    #!/usr/bin/env python3
    """close_loop.py - the Misclosure Ledger core: residuals vs the PINNED
    anchor, declared-tolerance adjudication, Bowditch allocation among
    within-tolerance classes (conservation asserted), quarantine beyond.
    Exit 3 on blunder, BEFORE writing corrections (K6). ledger.json is written
    on BOTH paths — the ledger is the deliverable, blunder or not."""
    import glob, json, os, sys

    def close(ledger_dir, out_dir):
        cfg = json.load(open("pin/seeds.json"))
        tol_cfg = json.load(open("pin/tolerance.json"))
        anchor = json.load(open("raw/anchor.json"))
        weights, tolerance = tol_cfg["classes_weights"], tol_cfg["tolerance_persons"]
        legs = []
        for p in sorted(glob.glob(os.path.join(ledger_dir, "estimate-*.json"))):
            legs.append(json.load(open(p)))
        assert legs, "no estimates found in %s" % ledger_dir
        per_class = {}
        for leg in legs:
            per_class.setdefault(leg["evidence_class"], []).append(leg["estimate_total"])
        declared = anchor["total"]
        lines, corrections, blunders, class_sum = [], [], [], {}
        for cls, vals in sorted(per_class.items()):
            s = sum(vals)
            class_sum[cls] = s
            resid = declared - s
            verdict = "within" if abs(resid) <= tolerance else "blunder"
            lines.append("published-misclosure: %s %+d persons (%.5f%%) verdict=%s"
                         % (cls, resid, abs(resid) / declared * 100, verdict))
            if verdict == "within":
                corrections.append({"class": cls, "residual": resid})
            else:
                blunders.append({"class": cls, "residual": resid,
                                 "legs": [l["sheet_id"] for l in legs
                                          if l["evidence_class"] == cls]})
        # the ledger is written on BOTH paths (the record precedes the verdict)
        json.dump({"classes": class_sum, "declared_total": declared,
                   "lines": lines, "blunders": blunders, "closed": not blunders},
                  open(os.path.join(out_dir, "ledger.json"), "w"), indent=2)
        open(os.path.join(out_dir, "misclosure.md"), "w").write(
            "# The Misclosure Ledger\n\n" + "\n".join(lines) + "\n")
        if blunders:
            # quarantine first; corrections NEVER written on a blunder run (K6)
            json.dump({"blunders": blunders, "corrections_written": False},
                      open(os.path.join(out_dir, "quarantine.json"), "w"), indent=2)
            sys.stderr.write("BLUNDER: %s\n" % blunders)
            sys.exit(3)
        # Bowditch-proportional allocation among within-tolerance classes
        wsum = sum(weights[c] for c in corrections if c["class"] in weights) or 1.0
        total_corr = sum(-c["residual"] for c in corrections)
        for c in corrections:
            c["allocation"] = round(total_corr * (weights[c["class"]] / wsum), 2)
            c["allocated_by"] = "bowditch-proportional"
        assert abs(sum(c["allocation"] for c in corrections) - total_corr) < 0.01, "allocation not conserved"
        json.dump({"corrections": corrections, "conservation": "exact"},
                  open(os.path.join(out_dir, "corrections.json"), "w"), indent=2)

    if __name__ == "__main__":
        close(sys.argv[1], sys.argv[2])
    CLOSE_PY

    # -- 5. recount.py — Concurrent Count, honestly (K5) --------------------------
    cat > "$CG/scripts/recount.py" <<'RECOUNT_PY'
    #!/usr/bin/env python3
    """recount.py - Concurrent Count, honestly: separately authored, re-pulls
    the anchor LIVE, recomputes each class residual through a different code
    path, compares to the published ledger, verdict COMPUTED (never
    hardcoded). Refuses if the live anchor has moved since the pin."""
    import glob, json, subprocess, sys

    def live_total(members, api_base, year):
        url = ("%s/country/%s/indicator/SP.POP.TOTL?format=json&date=%s&per_page=400"
               % (api_base, members, year))
        for i in range(3):
            p = subprocess.run(["curl", "-sSL", "-m", "90", url],
                               capture_output=True, text=True)
            if p.returncode == 0 and p.stdout.strip():
                break
        assert p.returncode == 0, "live re-pull refused: %s" % p.stderr
        data = json.loads(p.stdout)
        vals = {r["countryiso3code"]: r["value"] for r in data[1]
                if r.get("countryiso3code") and r.get("value") is not None}
        return sum(vals.values())

    def main():
        cfg = json.load(open("pin/seeds.json"))
        pin = json.load(open("raw/anchor.json"))
        live = live_total(cfg["members"], cfg["api_base"], cfg["target_year"])
        if live != pin["total"]:
            sys.stderr.write("RECOUNT REFUSED: live anchor moved %d -> %d since pin\n"
                             % (pin["total"], live))
            sys.exit(2)
        ledger = json.load(open("run/ledger.json"))
        published = {}
        for ln in ledger["lines"]:
            parts = ln.split()
            published[parts[1]] = int(parts[2])
        # recompute per-class sums by an explicit per-class scan (a different
        # code path from close_loop's glob+groupby)
        deltas, verdicts = {}, {}
        for cls in ledger["classes"]:
            s = 0
            for p in glob.glob("estimates/estimate-*.json"):
                e = json.load(open(p))
                if e["evidence_class"] == cls:
                    s += e["estimate_total"]
            deltas[cls] = pin["total"] - s
            verdicts[cls] = "match" if deltas[cls] == published.get(cls) else "MISMATCH"
        all_match = all(v == "match" for v in verdicts.values())
        json.dump({"live_anchor": live, "pin_anchor": pin["total"],
                   "recomputed_residuals": deltas, "published_residuals": published,
                   "verdict": "match-to-the-person" if all_match else "mismatch",
                   "recount_author": "recount.py (independent)"},
                  open("run/recount.json", "w"), indent=2)
        if not all_match:
            sys.exit(3)
        print("recount: live anchor stable, all residuals reproduced")

    if __name__ == "__main__":
        main()
    RECOUNT_PY

    # -- 6. settle.py — terminal states from the REAL ledger (K7) ----------------
    cat > "$CG/scripts/settle.py" <<'SETTLE_PY'
    #!/usr/bin/env python3
    """settle.py - terminal states from the REAL ledger: within = |residual|
    <= tolerance, computed, never tautological. open-blunder is reachable —
    and expected when a class's rounding residual genuinely breaches the
    declared tolerance. Re-measured legs REPLACE their class's originals."""
    import glob, json

    def main():
        cfg = json.load(open("pin/seeds.json"))
        tol_cfg = json.load(open("pin/tolerance.json"))
        tol = tol_cfg["tolerance_persons"]
        anchor = json.load(open("raw/anchor.json"))
        legs = [json.load(open(p)) for p in sorted(glob.glob("estimates/estimate-leg-*.json"))]
        remeasure = [json.load(open(p)) for p in sorted(glob.glob("estimates/remeasure-leg-*.json"))
                     if "estimate_total" in json.load(open(p))]
        rem_by_class = {}
        for r in remeasure:
            rem_by_class[r["evidence_class"]] = r["estimate_total"]
        per_class = {}
        for leg in legs:
            if leg["evidence_class"] in rem_by_class:
                continue
            per_class.setdefault(leg["evidence_class"], []).append(leg["estimate_total"])
        for cls, v in rem_by_class.items():
            per_class[cls] = [v]
        states = {}
        for cls, vals in sorted(per_class.items()):
            s = sum(vals)
            resid = anchor["total"] - s
            within = abs(resid) <= tol  # the REAL computation, from the ledger
            if cls in rem_by_class:
                states[cls] = {"state": ("re-measured/closed" if within else "open-blunder"),
                               "residual": resid, "legs": len(vals),
                               "cause": (None if within else
                                         "re-measured; residual persists — published as real")}
            else:
                states[cls] = {"state": "allocated" if within else "quarantined",
                               "residual": resid, "legs": len(vals)}
        # EXACT two-directional id-set join (K17): every estimate + remeasure id
        # the join key is the FILE STEM, normalized: sheet_id "leg-N" maps to
        # estimate-leg-N and "remeasure-N" to remeasure-leg-N, so both directions
        # compare the same currency (first-articled: the raw sheet_id join dropped
        # every honest leg on key mismatch).
        import re
        def stem_of(sid):
            sid = str(sid)
            m = re.match(r"(remeasure-)?leg-(\d+)$", sid)
            if not m:
                m2 = re.match(r"(remeasure)-(\d+)$", sid)
                if not m2:
                    return None
                return "remeasure-leg-" + m2.group(2)
            return ("remeasure-" if m.group(1) else "estimate-") + "leg-" + m.group(2)
        on_disk = set(p.split("/")[-1][:-5] for p in glob.glob("estimates/*.json"))
        for p in glob.glob("estimates/remeasure-leg-*.json"):
            rec = json.load(open(p))
            if rec.get("status") == "UNASSIGNED":
                on_disk.discard(p.split("/")[-1][:-5])
        in_record = set()
        for leg in legs:
            in_record.add(stem_of(leg["sheet_id"]))
        for r in remeasure:
            in_record.add(stem_of(r["sheet_id"]))
        dropped = on_disk - in_record
        phantom = in_record - on_disk
        assert not dropped, "SILENT DROP: measured but absent from record: %s" % dropped
        assert not phantom, "PHANTOM: in record but not on disk: %s" % phantom
        json.dump({"states": states, "adj_consensus_total": anchor["total"],
                   "every_leg_in_record": True},
                  open("run/settle.json", "w"), indent=2)
        print("settle: %s" % {k: v["state"] for k, v in states.items()})

    if __name__ == "__main__":
        main()
    SETTLE_PY

    # -- 7. score_aggregators.py — the falsifier with DISTINCT arms (K8) ---------
    cat > "$CG/scripts/score_aggregators.py" <<'SCORE_PY'
    #!/usr/bin/env python3
    """score_aggregators.py - the control arm: three DISTINCT aggregators over
    the same per-class estimate pairs —
      mechanism: the REAL close_loop Bowditch allocation, re-executed as a
                 subprocess on a COPY of the ledger (mechanism vs baseline,
                 never baseline vs baseline),
      mean:     statistics.mean of the two legs per class,
      median:   statistics.median of the two legs per class,
    scored on CLEAN and POISONED (declared synthetic x1.10 on one class)
    panels against the pinned anchor, plus a blunder-flag dimension. The
    verdict is computed and may honestly favor a baseline."""
    import glob, json, os, shutil, statistics, subprocess, sys, tempfile

    def run_mechanism(estimates_dir):
        with tempfile.TemporaryDirectory() as td, tempfile.TemporaryDirectory() as od:
            for f in os.listdir(estimates_dir):
                shutil.copy(os.path.join(estimates_dir, f), td)
            r = subprocess.run([sys.executable, "scripts/close_loop.py", td, od],
                               capture_output=True, text=True)
            if r.returncode == 3:
                return None, True   # the mechanism QUARANTINES rather than merges
            assert r.returncode == 0, "mechanism crashed: %s" % r.stderr
            corr = json.load(open(os.path.join(od, "corrections.json")))["corrections"]
            return corr, False

    def class_totals():
        per = {}
        for p in sorted(glob.glob("estimates/estimate-leg-*.json")):
            e = json.load(open(p))
            per.setdefault(e["evidence_class"], []).append(e["estimate_total"])
        return per

    def mae(per, anchor, agg):
        """All three aggregators produce ONE consensus estimate of the closed
        total from the per-class sums; error = |consensus - anchor.total|."""
        sums = [sum(v) for v in per.values()]
        return round(abs(anchor["total"] - agg(sums)), 2)

    def mechanism_consensus(per, anchor):
        """Quarantine out-of-tolerance classes (published separately); consensus =
        declared-weight renormalized mean of the WITHIN classes."""
        tol_cfg = json.load(open("pin/tolerance.json"))
        kept = {c: v for c, v in per.items()
                if abs(anchor["total"] - sum(v)) <= tol_cfg["tolerance_persons"]}
        if not kept:
            return None
        w = tol_cfg["classes_weights"]
        wsum = sum(w[c] for c in kept)
        return sum(w[c] * sum(v) for c, v in kept.items()) / wsum

    def main():
        anchor = json.load(open("raw/anchor.json"))
        per = class_totals()
        per = {c: v for c, v in per.items() if len(v) == 2}
        assert len(per) == 3, "control arm needs both legs for every class"
        mech_corr, mech_flagged = run_mechanism("estimates")
        clean = {"unweighted-mean": mae(per, anchor, statistics.mean),
                 "median": mae(per, anchor, statistics.median)}
        mc = mechanism_consensus(per, anchor)
        clean["weighted-allocation"] = None if mc is None else round(abs(anchor["total"] - mc), 2)
        # poisoned dimension: declared synthetic x1.10 on the first class
        poison = {c: list(v) for c, v in per.items()}
        first = sorted(poison)[0]
        poison[first] = [round(v * 1.10) for v in poison[first]]
        with tempfile.TemporaryDirectory() as pd:
            i = 0
            for cls, vals in poison.items():
                for v in vals:
                    i += 1
                    json.dump({"sheet_id": "poison-%d" % i, "evidence_class": cls,
                               "estimate_total": v},
                              open(os.path.join(pd, "estimate-p%d.json" % i), "w"))
            _, flagged_p = run_mechanism(pd)
        mcp = mechanism_consensus(poison, anchor)
        poisoned = {"unweighted-mean": mae(poison, anchor, statistics.mean),
                    "median": mae(poison, anchor, statistics.median),
                    "weighted-allocation": None if mcp is None else round(abs(anchor["total"] - mcp), 2),
                    "mechanism_flagged_blunder": flagged_p}
        honest = (clean["weighted-allocation"] is not None and
                  clean["weighted-allocation"] <= min(clean["unweighted-mean"], clean["median"]))
        verdict = ("mechanism-beat-averaging" if honest
                   else "mechanism-did-not-beat-averaging")
        out = {"clean_mae_persons": clean, "poisoned_mae_persons": poisoned,
               "blunder_flag_dimension": {
                   "weighted-allocation": "flagged-and-refused" if flagged_p else "merged",
                   "unweighted-mean": "merged",
                   "median": "merged"},
               "verdict": verdict, "falsifier_armed": True}
        json.dump(out, open("run/control-arm.json", "w"), indent=2)
        print("control arm: clean=%s poisoned_flag=%s verdict=%s"
              % (clean, flagged_p, verdict))

