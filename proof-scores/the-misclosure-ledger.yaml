    3: "calibration 2 — six sealed items through codex-cli"
    4: "calibration 3 — six sealed items through antigravity"
    5: "census — live-route families, rho-bar over captured errors, detector self-test, three pairwise-distinct assertion, panel manifest"
    6: "first article — share-A workload by family B through the full-teeth contract gate (reference/, never estimates/)"
    7: "measurer leg 1 — share class, workload A (claude-code)"
    8: "measurer leg 2 — share class, workload B (codex-cli)"
    9: "measurer leg 3 — urban class, workload A (antigravity)"
    10: "measurer leg 4 — urban class, workload B (claude-code)"
    11: "measurer leg 5 — growth class, workload A (codex-cli)"
