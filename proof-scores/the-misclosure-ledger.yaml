# ║       persons vs the pinned 448,897,545 anchor — the misclosure is REAL       ║
# ║       (publication rounding), never manufactured from the estimates.          ║
# ║   K4  "declared totals never exist"               → the anchor is fetched,    ║
# ║       sha256-pinned and COMMITTED at movement 1, before any estimate exists.  ║
# ║   K5  "recount is a forgery (hardcoded verdict)"  → recount.py re-pulls the   ║
# ║       anchor live and recomputes every residual through a separately          ║
# ║       authored code path; the verdict is computed from the comparison.        ║
# ║   K6  "negative control writes corrections on a blunder" → corrections are    ║
# ║       written only AFTER the blunder check; the poisoned run exits 3 with     ║
# ║       no corrections file. The conjunction is re-executed by validation.      ║
