# ║      re-deriving the total from a different published statistic of the same   ║
# ║      27 member states.                                                       ║
# ║                                                                               ║
# ║  COMPOSING       : Concurrent Count (recount.py — separately authored,        ║
# ║                    re-pulls the anchor LIVE and recomputes every published    ║
# ║                    residual through a different code path; the closer cannot  ║
# ║                    grade its own homework), Condorcet's Premise (consumed —   ║
