    #!/usr/bin/env python3
    """join_check.py - every figure rendered on the site exists in
    dataset.json, with checked > 0 ENFORCED: a vacuous pass over zero figures
    refuses."""
    import json, re, sys
    from html.parser import HTMLParser

    class FigExtractor(HTMLParser):
        def __init__(self):
            super().__init__()
            self.text = []
        def handle_data(self, data):
            self.text.append(data.strip())

    def main(site_dir, dataset_path):
        ds = json.load(open(dataset_path))
        allowed = set()
        def walk(o):
            if isinstance(o, dict):
                for v in o.values(): walk(v)
            elif isinstance(o, list):
                for v in o: walk(v)
            elif isinstance(o, (int, float)):
                n = int(o)
                allowed.update({str(n), "%+d" % n, "%.2f" % o})
        walk(ds)
        checked = 0
        for page in ("index.html", "blunders.html", "methodology.html"):
            p = FigExtractor()
            p.feed(open("%s/%s" % (site_dir, page)).read())
            for fig in p.text:
                for tok in re.findall(r"[+-]?\d+", fig):
                    checked += 1
                    clean = tok.lstrip("+-")
                    assert tok in allowed or clean in allowed or clean.rstrip("0123456789") == "", \
                        "figure %r on %s is NOT in dataset.json" % (tok, page)
        assert checked >= 5, "join check vacuous: %d figures checked" % checked
        print("join check: %d figures verified against dataset.json" % checked)

    if __name__ == "__main__":
        main(sys.argv[1], sys.argv[2])
