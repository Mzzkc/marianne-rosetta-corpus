name: closing-grid
description: "The Misclosure Ledger proof (revised) — three evidence classes independently re-derive the same closed additive total (EU27 2023 population) from live World Bank statistics of the same 27 member states; the residual against the pinned, pre-committed anchor is measured per class, allocated within a pre-declared tolerance by pre-committed Bowditch weights, and quarantined beyond it as a published open blunder with its attributed cause (the growth class's rounding residual is real — its magnitude varies with the API's GROW vintage, which is exactly why it must be measured, not asserted — and it is published, not smoothed); an independently authored recount re-pulls the anchor live and recomputes every residual; a three-distinct-aggregator control arm scores the mechanism against mean and median on clean and poisoned panels and may honestly lose a dimension; and the published site's served bytes hash-match the build."

# workspace: intentionally omitted — auto-managed at <workspace-root>/closing-grid (#58).
# The score never writes outside its workspace except the ONE heralded external
# effect: the public repo push + tagged dataset release + Pages deploy at
# movement 12, gated gas-free on served-byte hashes.

instrument: claude-code
instrument_config:
  timeout_seconds: 1800

# Only the narrator (18) may fall back across vendors: editorial voice is not
# evidence. Every measurement-adjacent AI sheet pins its vendor identity —
# it IS the independence the census certifies.
instrument_fallbacks: [codex-cli]

movements:
  1:
    name: "Tool Chain + Pre-Register"
    instrument: cli            # The Dropped Axiom + Etiquette Law: fetch live,
    instrument_fallbacks: []   # integrity-check, author EVERY script, build
    instrument_config:         # sealed record packets, write tolerance.yaml +
      timeout_seconds: 1800    # the pinned anchor, COMMIT before measurement,
                               # open the write-time record. No env vars —
                               # pin/seeds.json is the authority.
  2:
    name: "Calibration Capture (Condorcet's Premise, consumed)"
    instrument: claude-code    # THE CAPTURE THE ORIGINAL LACKED: each candidate
    instrument_fallbacks: []   # instrument runs six sealed-answer items.
    instrument_config:
      timeout_seconds: 900
  3:
    name: "Census"
    instrument: cli            # families from LIVE ROUTES (mzt instruments
    instrument_fallbacks: []   # check → Default model → family token), ρ̄ over
    instrument_config:         # the captured calibration errors, detector
      timeout_seconds: 900     # self-test on a planted-correlation panel,
                               # THREE PAIRWISE-DISTINCT assertion, panel
                               # manifest. Weights are NOT touched here —
                               # tolerance.yaml stays the one authority.
  4:
    name: "First Article"
    instrument: codex-cli      # family B characterizes ONE workload (share-A)
    instrument_fallbacks: []   # through the FULL-teeth contract gate before
    instrument_config:         # the 6-leg spend. Output to reference/, never
      timeout_seconds: 1200    # estimates/ — the id-set join stays exact.
  5:
    name: "Measurer Fan-Out (3 classes x 2 workloads)"
    instrument: claude-code    # every leg derives the SAME closed total from
    instrument_fallbacks: []   # its class's published statistic over its
    instrument_config:         # sealed workload packet only. Two families per
      timeout_seconds: 1800    # class. One file per leg — no shared writes.
  6:
    name: "Close + Teeth + Recount"
    instrument: cli            # residuals vs the PINNED anchor, tolerance
    instrument_fallbacks: []   # adjudication, Bowditch allocation among
    instrument_config:         # within-tolerance classes (conservation
      timeout_seconds: 1800    # asserted), quarantine + remeasure-plan, the
                               # poisoned negative control (exit 3, NO
                               # corrections), the 6-file barrier (this sheet
                               # DEPENDS on all legs — no race), then the
                               # independent recount: re-pull live, recompute,
                               # compare to the cent... to the PERSON.
  7:
    name: "Re-Measure Fan-Out"
    instrument: claude-code    # diagnosis-carrying retry: the quarantined
    instrument_fallbacks: []   # class re-derived by a family that authored
    instrument_config:         # NEITHER original leg, WITH the blunder
      timeout_seconds: 1500    # context. Surplus legs write UNASSIGNED
                               # markers; overflow classes are carried as
                               # unassigned-blunder. No silent drops.
  8:
    name: "Settle"
    instrument: cli            # within = |residual| <= tolerance, from the
    instrument_fallbacks: []   # REAL ledger — open-blunder is reachable and
    instrument_config:         # expected. Terminal state per class; exact
      timeout_seconds: 900     # two-directional id-set join; adj-consensus
                               # carries every sheet id.
  9:
    name: "Control Arm (the falsifier)"
    instrument: cli            # mechanism = the REAL close_loop allocation
    instrument_fallbacks: []   # re-executed as a subprocess on a copied
    instrument_config:         # ledger; baselines = statistics.mean / median.
      timeout_seconds: 1200    # Clean + poisoned (x1.10 per class) dimensions,
                               # blunder-flag dimension, honest verdict that
                               # may read median-wins-clean.
  10:
    name: "Blunder Narration"
    instrument: claude-code    # prose under the surveying ethos; every claim
    instrument_fallbacks: [codex-cli]   # number-gated against ledger.json by
    instrument_config:         # validation (numbers extracted FROM the
      timeout_seconds: 1200    # ledger, never hardcoded in the check).
  11:
    name: "Site Build + Join Check"
    instrument: cli            # stdlib-only HTML site + dataset.json; the
    instrument_fallbacks: []   # join check proves every rendered figure
    instrument_config:         # exists in the dataset with checked > 0
      timeout_seconds: 900     # enforced; HTMLParser well-formedness gate.
  12:
    name: "Publish + Gas-Free Gate"
    instrument: cli            # repo (case-insensitive owner), /docs Pages
    instrument_fallbacks: []   # source (the SUPPORTED root), idempotent
    instrument_config:         # release, then hash SERVED BYTES vs built.
      timeout_seconds: 1800
  13:
    name: "Write-Time Record + Demobilize"
    instrument: cli            # the record opened at movement 1 is verified
    instrument_fallbacks: []   # complete against actuals; scoped orphan
    instrument_config:         # process check. Nothing created this run
      timeout_seconds: 600     # outlives it unaccounted.

sheet:
  size: 1
  total_items: 13           # movements pre-expansion; engine expands to 21 sheets
  fan_out:
    2: 3                    # calibration capture: one sheet per candidate instrument
    5: 6                    # measurer legs: 3 classes x 2 workloads
    7: 2                    # re-measure legs (assignment from remeasure-plan)
  dependencies:             # movement-keyed; the engine expands to the sheet DAG.
    2: [1]                  # capture needs the sealed items + scripts
    3: [2]                  # census needs every capture file
    4: [3]                  # first article runs under a CERTIFIED panel
    5: [4]                  # volume only after the contract is proven
    6: [5]                  # the closer depends on ALL SIX legs (barrier here,
                           # not on the parallel legs — the race is dead)
    7: [6]                  # re-measure needs the quarantine + plan
    8: [7]                  # settle joins original + re-measured artifacts
    9: [8]                  # the falsifier needs the settled record
    10: [9]                 # narration needs the verdict it explains
    11: [10]                # the site needs the stories
    12: [11]                # deploy sits behind the join + structure gates
    13: [12]                # demobilize accounts for what deploy created

  # Vendor spread — expanded-SHEET numbers. FULL concrete coverage on every
  # fan-out movement (V308-clean). Calibration (2-4): one sheet per family.
  # Measurers (7-12): each class's two workload legs ride DIFFERENT families.
  # Re-measure (14-15): family A — neither original growth leg was family A.
  per_sheet_instruments:
    2: claude-code           # calibration 1 (routes to GLM on this host — the
    3: codex-cli             # calibration 2   census certifies the ROUTE family,
    4: antigravity           # calibration 3   not the profile name)
    7: claude-code           # leg 1 share-A
    8: codex-cli             # leg 2 share-B
    9: antigravity           # leg 3 urban-A
    10: claude-code          # leg 4 urban-B
    11: codex-cli            # leg 5 growth-A
    12: antigravity          # leg 6 growth-B
    14: claude-code          # re-measure 1 (fresh family for the quarantined
    15: claude-code          # re-measure 2   class; marker if unassigned)

