# ║       statistics.median, scored clean AND poisoned (a declared synthetic      ║
# ║       x1.10 blunder per class). The verdict may honestly read that median     ║
# ║       beats the mechanism on clean total error — and the run still publishes. ║
# ║   K9  "calibration capture does not exist"       → movement 2 IS the capture: ║
# ║       a 3-instance fan-out, one per candidate instrument, each running six    ║
# ║       sealed-answer calibration items; movement 3's census consumes the       ║
# ║       captured files. Cold cache is impossible.                               ║
# ║   K10 "family from name prefix is letterhead"    → census.py derives family   ║
# ║       from the LIVE resolved route (mzt instruments check → Default model),   ║
# ║       so claude-code → GLM on this host, and asserts THREE PAIRWISE-DISTINCT  ║
# ║       families from evidence, not from names. gemini-cli (absent) is gone;   ║
# ║       antigravity (Gemini route) is the third family.                        ║
# ║   K11 "count validation races parallel siblings" → the 6-file barrier check   ║
# ║       lives on movement 6 (the closer, which DEPENDS on all six legs);        ║
# ║       per-leg validations check only that leg's own file and roster.          ║
# ║   K12 "hugo/pa11y/lighthouse fiction"             → no external site stack.    ║
# ║       build_site.py is stdlib-only HTML; join_check.py proves every rendered  ║
# ║       figure exists in dataset.json with checked > 0 enforced; a stdlib       ║
# ║       HTMLParser well-formedness gate replaces the pa11y theater.             ║
# ║   K13 "Pages path /site/public invalid; owner case mismatch"                  ║
# ║       → Pages source is the SUPPORTED /docs root; the gh identity check       ║
# ║       compares lowercased logins; release upload is idempotent (--clobber,    ║
# ║       create only if missing).                                                ║
# ║   K14 "live check greps one keyword"              → the gas-free gate hashes   ║
# ║       the SERVED bytes of index.html and dataset.json and compares to the     ║
# ║       built bytes (join-semilattice-merge discipline), after a bounded        ║
# ║       propagation wait.                                                       ║
# ║   K15 "write-time record is end-time archaeology"→ provenance/created-        ║
# ║       objects.md is AUTHORED at movement 1 (obligations at creation time),    ║
# ║       appended with actuals at movement 12, verified complete at 13.          ║
# ║   K16 "static remeasure width vs dynamic blunders"→ the closer writes an      ║
# ║       explicit remeasure-plan.json (per-leg assignment, surplus legs write    ║
# ║       UNASSIGNED markers, overflow classes are carried as unassigned-blunder  ║
# ║       and published — no silent drops in any branch).                         ║
# ║   K17 "first-article.json breaks the id-set join"→ the first article lives    ║
# ║       in reference/, never estimates/; settle's join covers every estimate    ║
# ║       and remeasure id exactly, both directions.                              ║
# ║                                                                               ║
# ║  PRIMARY PATTERN : The Misclosure Ledger — N independent estimates of one    ║
# ║      closed additive total disagree; the residual is measured, published,     ║
# ║      and allocated by pre-declared weight within tolerance — never averaged   ║
# ║      away, never argued away — and beyond-tolerance legs are quarantined      ║
# ║      as blunders: flagged, investigated, re-measured once, and if the         ║
# ║      residual is REAL it is published as an open blunder with its cause.      ║
# ║      Here the closed quantity is the EU27 2023 population and the N           ║
# ║      measurements are three evidence classes (female-share division,         ║
