    #!/usr/bin/env python3
    """check_estimate.py - the FULL-teeth contract gate: schema, roster
    membership, non-empty legs, positivity, per-country line items, sum
    identity, and sealed-packet provenance digest."""
    import hashlib, json, sys

    def main(path):
        e = json.load(open(path))
        cfg = json.load(open("pin/seeds.json"))
        classes = ["share", "urban", "growth"]
        for k in ("sheet_id", "evidence_class", "estimate_total", "line_items", "packet_sha256"):
            assert k in e, "missing key %s" % k
        assert e["evidence_class"] in classes, "class %s not in roster" % e["evidence_class"]
        assert isinstance(e["estimate_total"], (int, float)) and e["estimate_total"] > 0, "total must be positive"
        li = e["line_items"]
        assert isinstance(li, list) and len(li) >= 10, "line_items must carry the roster members (>=10)"
        s = sum(x["population"] for x in li)
        assert abs(s - e["estimate_total"]) <= 1, "line items (%d) != estimate_total (%d)" % (s, e["estimate_total"])
        # packet provenance: the leg must derive from ITS sealed packet
        leg_no = int(e["sheet_id"].rsplit("-", 1)[-1])
        pk = "packets/packet-leg-%d.json" % leg_no
        d = hashlib.sha256(open(pk, "rb").read()).hexdigest()
        assert e["packet_sha256"] == d, "provenance: estimate not derived from its sealed packet"
        print("estimate OK: %s class=%s total=%d from packet %s"
              % (e["sheet_id"], e["evidence_class"], e["estimate_total"], pk))

    if __name__ == "__main__":
        main(sys.argv[1])
    CHECK_PY

