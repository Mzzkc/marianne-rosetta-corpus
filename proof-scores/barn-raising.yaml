    #!/usr/bin/env python3
    """Sort segments by (occurrence count, trail length); pair ADJACENT
    strata neighbors (sorted order IS the match — ratios are reported, not
    asserted); randomize arm within each pair under the pinned seed. Emit
    run/assignment.json with a per-instance map."""
    import json, os, random
    HERE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
    meta = json.load(open(os.path.join(HERE, "run/meta.json")))
    random.seed(int(meta["seed"]))
    man = json.load(open(os.path.join(HERE, "grounding/grounding-manifest.json")))
    geo = json.load(open(os.path.join(HERE, "geometry/segments.geojson")))
    length = {f["properties"]["segment_id"]: f["properties"]["length_km"]
              for f in geo["features"]}
    count = {s["segment_id"]: s["record_count"] for s in man["segments"]}
    segs = sorted(count, key=lambda s: (count[s], length[s]))
    assert len(segs) % 2 == 0, "segment count must be even for paired arms"
    pairs, inst, instance_map = [], 1, {}
    for pi in range(0, len(segs), 2):
        a, b = segs[pi], segs[pi+1]              # adjacent in sorted order
        t, c = random.sample([a, b], 2)          # seeded coin: which is treatment
        pairs.append({"pair_id": "pair-%02d" % (pi//2+1), "treatment": t, "control": c,
                      "strata": {"occurrence_count": [count[a], count[b]],
                                 "length_km": [length[a], length[b]]}})
        instance_map[str(inst)] = {"arm": "treatment", "segment": t};  inst += 1
        instance_map[str(inst)] = {"arm": "control",   "segment": c};  inst += 1
    json.dump({"seed": meta["seed"], "pairs": pairs, "instance_map": instance_map},
              open(os.path.join(HERE, "run/assignment.json"), "w"), indent=2)
    print("ASSIGNED: %d pairs, seed %s" % (len(pairs), meta["seed"]))
    PEOF
