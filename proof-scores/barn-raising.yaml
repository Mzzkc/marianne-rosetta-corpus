            if norm not in files:
                bad.append("%s -> %s" % (rel, target))
    if bad:
        sys.exit("BROKEN LINKS (%d):\n  %s" % (len(bad), "\n  ".join(bad)))
    print("ALL LINKS VALID (%d pages)" % len(files))
