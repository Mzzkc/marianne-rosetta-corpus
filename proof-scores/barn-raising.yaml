    #!/usr/bin/env python3
    """Fetch GBIF occurrences per segment polygon (paged, cap 600); pin
    bytes + sha256; per-segment reproducible query hash; degrade thin
    segments to the whole-park union, recorded; emit grounding-manifest.json."""
    import hashlib, json, os, time
    import requests

    meta = json.load(open("run/meta.json"))
    GBIF = meta["park"]["gbif"]
    PARAMS = ("hasCoordinate=true|fields=occurrenceID,scientificName,"
              "vernacularName,eventDate,month")
    CAP = 600
    UA = {"User-Agent": "wayside-library-proof/2.0 (marianne rosetta corpus)"}
    seg_ids = sorted(s[:-4] for s in os.listdir("geometry/segment-polygons")
                     if s.endswith(".wkt"))

    def qhash(wkt):
        return hashlib.sha256((wkt.strip() + "|" + PARAMS).encode()).hexdigest()

    def fetch(wkt, tries=3):
        """Page until endOfRecords or CAP; return (bytes, truncated).
        Retries transient GBIF 5xx; a persistent 4xx re-raises (a malformed
        polygon is a geometry bug, not a network event)."""
        results, offset = [], 0
        while True:
            for i in range(tries):
                r = requests.get(GBIF, params={
                    "geometry": wkt, "hasCoordinate": "true", "limit": 300,
                    "offset": offset,
                    "fields": "occurrenceID,scientificName,vernacularName,eventDate,month"},
                    headers=UA, timeout=120)
                if r.status_code < 500:
                    break
                time.sleep(20 * (i + 1))
            r.raise_for_status()
            j = r.json()
            results.extend(j.get("results", []))
            if j.get("endOfRecords") or len(results) >= CAP or not j.get("results"):
                break
            offset += 300
            time.sleep(1)
        truncated = len(results) >= CAP
        return json.dumps({"results": results}).encode(), truncated

    # whole-park union polygon for the thin-record downgrade (WGS84 in/out)
    from shapely.geometry import MultiPoint
    from shapely import wkt as shwkt
    polys = [shwkt.loads(open(f"geometry/segment-polygons/{s}.wkt").read())
             for s in seg_ids]
    park_wkt = MultiPoint(
        [p for poly in polys for p in poly.exterior.coords]).convex_hull.wkt

    man = {"fetched_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
           "params": PARAMS, "record_cap": CAP, "segments": [], "species_names": []}
    names = set()
    for sid in seg_ids:
        wkt = open(f"geometry/segment-polygons/{sid}.wkt").read()
        raw, truncated = fetch(wkt)
        recs = json.loads(raw).get("results", [])
        used_wkt = wkt
        granularity = "segment"
        if len(recs) < 5:
            raw, truncated = fetch(park_wkt)
            recs = json.loads(raw).get("results", [])
            used_wkt = park_wkt
            granularity = "whole-park-downgrade"
        os.makedirs(f"grounding/{sid}", exist_ok=True)
        path = f"grounding/{sid}/occurrences.json"
        open(path, "wb").write(raw)
        for r in recs:
            if r.get("scientificName"):
                names.add(r["scientificName"])
            if r.get("vernacularName"):
                names.add(r["vernacularName"])
        man["segments"].append({
            "segment_id": sid, "granularity": granularity,
            "record_count": len(recs), "truncated": truncated,
            "occurrence_ids": [r.get("occurrenceID") or r.get("key")
                               for r in recs if r.get("occurrenceID") or r.get("key")],
            "query_hash": qhash(used_wkt),
            "query_wkt": used_wkt.strip(),
            "sha256": hashlib.sha256(raw).hexdigest(), "path": path,
            "wkt_sha256": hashlib.sha256(wkt.encode()).hexdigest()})
    man["species_names"] = sorted(names)
    json.dump(man, open("grounding/grounding-manifest.json", "w"), indent=2)
    print("GROUNDING FETCHED: %d segments, %d species names" % (len(man["segments"]), len(names)))
    PEOF
