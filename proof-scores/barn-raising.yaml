    #!/usr/bin/env python3
    """Phenology windows = IQR month ranges per species per segment, computed
    from the PINNED bytes (>=5 records). Statistics, never recollection."""
    import json, os, re, statistics
    HERE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))

    def month_of(rec):
        if rec.get("month"):
            return int(rec["month"])
        d = rec.get("eventDate") or ""
        m = re.match(r"^\d{4}-(\d{2})", d)
        return int(m.group(1)) if m else None

    man = json.load(open(os.path.join(HERE, "grounding/grounding-manifest.json")))
    out = {}
    for seg in man["segments"]:
        recs = json.load(open(os.path.join(HERE, seg["path"]))).get("results", [])
        by_species = {}
        for r in recs:
            mo = month_of(r)
            if mo and r.get("scientificName"):
                by_species.setdefault(r["scientificName"], []).append(mo)
        out[seg["segment_id"]] = {
            sci: {"window": "%d-%d" % (int(statistics.quantiles(mos, n=4)[0]),
                                       int(statistics.quantiles(mos, n=4)[2])),
                  "n": len(mos)}
            for sci, mos in by_species.items() if len(mos) >= 5}
    json.dump(out, open(os.path.join(HERE, "grounding/phenology.json"), "w"), indent=2)
    print("PHENOLOGY COMPUTED")
