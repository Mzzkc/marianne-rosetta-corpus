    {% elif stage == 3 %}
    {{ strict() }}
    # ── M2 · Trail Geometry — deterministic foundation ──────────────────────
    # r2: query the park RELATION, clip trails to the park polygon (not the
    # bbox), segment along CONNECTED components (no synthetic bridges across
    # forks), derive the UTM zone from the centroid, and write WGS84 WKT
    # with CLOSED rings. The mileage check ties the network to published
    # reality (±20%).
    .venv/bin/python - <<'PEOF'
    import json, math, time
    import requests
    from shapely.geometry import LineString, MultiLineString, Polygon, mapping, shape
    from shapely.ops import transform, unary_union, linemerge
    import pyproj

    meta = json.load(open("run/meta.json"))
    OV = meta["park"]["overpass"]; REL = meta["park"]["osm_id"]
    UA = {"User-Agent": "wayside-library-proof/2.0 (marianne rosetta corpus)"}

    def ov(query, tries=4):
        for i in range(tries):
            try:
                r = requests.get(OV, params={"data": query}, headers=UA, timeout=180)
                if r.status_code == 200:
                    time.sleep(5)          # courtesy gap: mirrors rate-limit
                    return r.json()
            except requests.RequestException:
                pass
            time.sleep(30 * (i + 1))       # backoff: public mirrors 504 under
                                           # rapid fire (observed live, r2)
        raise SystemExit("Overpass failed after %d tries: %s" % (tries, query[:60]))

    # park boundary: single closed element (way or relation member) by type
    ELEM = meta["park"].get("osm_type", "relation")
    if ELEM == "way":
        d = ov(f"[out:json][timeout:90];way({REL});out geom;")
        el = next(w for w in d["elements"]
                  if w.get("type") == "way" and "geometry" in w)
        ring = LineString([(p["lon"], p["lat"]) for p in el["geometry"]])
        assert ring.is_ring, "park way is not a closed ring"
        park = Polygon(ring)
    else:
        d = ov(f"[out:json][timeout:90];relation({REL});way(r);out geom;")
        ways = [w for w in d["elements"]
                if w.get("type") == "way" and "geometry" in w]
        assert ways, "no relation member ways returned by Overpass"
        frags = [LineString([(p["lon"], p["lat"]) for p in w["geometry"]])
                 for w in ways]
        merged = linemerge(unary_union(frags))
        park = Polygon(merged) if isinstance(merged, LineString) \
            else merged.convex_hull
    open("geometry/raw-ways.json", "w").write(json.dumps(d))
    assert park.is_valid and park.area > 0, "park polygon invalid"
    json.dump({"type": "Feature", "properties": {"name": meta["park"]["name"]},
               "geometry": mapping(park)}, open("geometry/park.geojson", "w"))

    # trails INSIDE the park polygon (clipped, not bbox-fetched)
    bb = park.bounds
    bbox = f"{bb[1]:.6f},{bb[0]:.6f},{bb[3]:.6f},{bb[2]:.6f}"
    t = ov(f'[out:json][timeout:120];(way["highway"~"path|footway|steps"]({bbox}););out geom;')
    trail_ways = [w for w in t["elements"]
                  if w.get("type") == "way" and "geometry" in w]
    assert trail_ways, "no trail ways returned"
    trail_lines = []
    for w in trail_ways:
        ln = LineString([(p["lon"], p["lat"]) for p in w["geometry"]])
        clipped = ln.intersection(park)
        if not clipped.is_empty and clipped.length > 0:
            trail_lines.append(clipped)
    assert trail_lines, "no trails fall inside the park polygon"
    open("geometry/raw-trails.json", "w").write(json.dumps(t))

    # UTM zone DERIVED from the park centroid — no hardcoded CRS (r2)
    clon = park.centroid.x
    zone = int(math.floor((clon + 180) / 6) % 60) + 1
    south = park.centroid.y < 0
    utm = "EPSG:%d" % (32700 + zone if south else 32600 + zone)
    fwd = pyproj.Transformer.from_crs("EPSG:4326", utm, always_xy=True).transform
    inv = pyproj.Transformer.from_crs(utm, "EPSG:4326", always_xy=True).transform

    proj_lines = [transform(fwd, ln) for ln in trail_lines]
    net_km = unary_union(proj_lines).length / 1000.0
    exp = float(meta["park"]["expected_trail_km"])
    assert abs(net_km - exp) / exp <= 0.20, \
        f"total trail km {net_km:.1f} outside ±20% of published {exp}"

    # GROUP connected components into n spatially-contiguous segments along
    # the network's principal axis (the canyon axis here). A real trail
    # network is dozens of disconnected components; 8 segments must COVER
    # the network, not cherry-pick the 8 longest pieces (live-tested: that
    # drops 4 of 7 km). Each group keeps its full length; the corridor
    # polygon is the group's convex hull buffered 150 m — local, single,
    # valid. (r2, verified against live OSM data for the venue.)
    import numpy as np
    n = int(meta["segments"])
    components = unary_union(proj_lines)
    comps = list(components.geoms) if hasattr(components, "geoms") else [components]
    comps = [c for c in comps if c.length > 20]      # ignore <20 m slivers
    assert comps, "no usable trail components"
    pts = np.array([xy for c in comps for xy in c.coords])
    center = pts.mean(axis=0)
    axis = np.linalg.svd(pts - center, full_matrices=False)[2][0]
    def along(g):
        return float(np.dot(np.array([g.centroid.x, g.centroid.y]) - center, axis))
    idx = sorted(range(len(comps)), key=lambda i: along(comps[i]))
    total_len = sum(c.length for c in comps)
    target = total_len / n
    groups, acc, cur = [], 0.0, []
    for i in idx:
        cur.append(comps[i]); acc += comps[i].length
        if acc >= target and len(groups) < n - 1:
            groups.append(cur); cur, acc = [], 0.0
    if cur:
        if len(groups) < n:
            groups.append(cur)
        else:
            groups[-1].extend(cur)
    while len(groups) < n:                     # split the largest by axis order
        groups.sort(key=lambda g: -sum(c.length for c in g))
        big = groups.pop(0)
        big.sort(key=along)
        half = sum(c.length for c in big) / 2
        run, k = 0.0, 1
        for j, c in enumerate(big):
            run += c.length
            if run >= half:
                k = j + 1; break
        groups.extend([big[:k] or big[:1], big[k:] or big[-1:]])
    assert len(groups) == n, "grouping failed to produce %d segments" % n
    segs = [(unary_union(g), sum(c.length for c in g) / 1000.0) for g in groups]

    feats = []
    for i, (seg_union, seg_km) in enumerate(segs, 1):
        poly = seg_union.convex_hull.buffer(150).simplify(75)  # ~150 m corridor
        poly_wgs = transform(inv, poly)                   # WGS84 BEFORE write (r2)
        ring = list(poly_wgs.exterior.coords)
        if len(ring) > 12:                                # cap, then RE-CLOSE (r2)
            ring = ring[:11] + [ring[0]]
        assert ring[0] == ring[-1], f"segment {i}: unclosed ring"
        # GBIF rejects clockwise exterior rings (live-tested: HTTP 400
        # "Polygon with clockwise exterior ring") — enforce CCW (r2)
        import numpy as _np
        _a = _np.array(ring)
        _area = float(_np.cross(_a[:-1], _a[1:]).sum())   # shoelace, signed
        if _area < 0:
            ring = ring[::-1]
        wkt = "POLYGON ((" + ", ".join(f"{x:.6f} {y:.6f}" for x, y in ring) + "))"
        sid = f"seg-{i:02d}"
        open(f"geometry/segment-polygons/{sid}.wkt", "w").write(wkt)
        feats.append({"type": "Feature", "id": sid,
                      "properties": {"segment_id": sid,
                                     "length_km": round(seg_km, 3)},
                      "geometry": mapping(poly_wgs)})
    json.dump({"type": "FeatureCollection", "utm_crs": utm,
               "features": feats},
              open("geometry/segments.geojson", "w"), indent=2)
    print("GEOMETRY: %d segments covering %.2f km from %d components, UTM %s"
          % (n, sum(k for _, k in segs), len(comps), utm))
    PEOF

    # ── scripts/check-geometry.py — the geometry gate (r2: WGS84 + closure) ─
