    .venv/bin/python scripts/drift.py --selftest
    .venv/bin/python scripts/drift.py --run --out run/drift-report.json
    .venv/bin/python -c "
    import json
    d = json.load(open('run/drift-report.json'))
    assert len(d['metrics']) == 5 and d['pair_analysis'], 'report incomplete'
    print('n(treatment)=%d/%d n(control)=%d/%d' % (
        d['arms']['treatment']['n'], d['arms']['treatment']['n_written'],
