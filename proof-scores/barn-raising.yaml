# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║          BARN RAISING — THE WAYSIDE LIBRARY (proof score, r2)                 ║
# ║   sheet 21 · pass 1 of 2 · revised against reviews 1–3 (05-review-*.md)       ║
# ║                                                                               ║
# ║  PRIMARY PATTERN : Barn Raising — N writers produce the SAME KIND of          ║
# ║                    artifact (an interpretive wayside page) about              ║
# ║                    DIFFERENT subjects (trail segments), each writing          ║
# ║                    under judgment and therefore capable of N                  ║
# ║                    reasonable-but-incompatible choices. The pattern's         ║
# ║                    contribution is the CONVENTION layer — the                 ║
# ║                    judgment-bearing standards (voice, heading grammar,        ║
# ║                    glossary discipline, naming, alt-text style,               ║
# ║                    cultural-sensitivity rules) that keep parallel             ║
# ║                    writers coherent where a frozen schema cannot              ║
# ║                    reach. Existing corpus proofs prove the CONTRACT           ║
# ║                    side of parallel work; this score isolates the             ║
# ║                    convention side: a two-arm fan-out where                   ║
# ║                    treatment writers hold conventions.md and control          ║
# ║                    writers hold ONLY the frozen schema — drift is            ║
# ║                    then MEASURED, not asserted. If the control arm            ║
# ║                    does not drift more, the verdict is FALSIFIED and          ║
# ║                    the proof says so.                                        ║
# ║                                                                               ║
# ║  REVISION r2 — every change answers a named finding in 05-review-1/2/3.md:    ║
# ║   R1.1/R3.1  mdbook + linkchecker REMOVED — no non-venue binaries. The site   ║
# ║               is built by scripts/build-site.py (python-markdown, one         ║
# ║               template, nav from directory scan) and link-checked by          ║
# ║               scripts/check-links.py — heredoc-authored, exit-coded.          ║
# ║   R1.2       WKT polygons are written in WGS84 (EPSG:4326); rings             ║
# ║               closed (first == last); the ≤12-vertex cap re-closes            ║
# ║               the ring after simplify. GBIF never sees a projected            ║
# ║               coordinate.                                                     ║
# ║   R1.3/R2.2  Trails are fetched by park RELATION, clipped to the park         ║
# ║               polygon (not bbox), and segmented along CONNECTED               ║
# ║               components by arc position — no synthetic bridges across        ║
# ║               unrelated branches.                                             ║
# ║   R1.4/R3.5  Stratigraphy vocabulary EMBEDDED as pinned bytes (the            ║
# ║               previously cited host is dead in DNS — verified). Pages         ║
# ║               declare geology_terms; the grounding gate checks each           ║
# ║               against the vocabulary — term-level entailment, not             ║
# ║               byte custody alone.                                             ║
# ║   R1.5/R3.6  scripts/check-schema-freeze.py is AUTHORED at M0 — no           ║
# ║               ghost scripts anywhere in the score.                            ║
# ║   R1.6       UTM zone DERIVED from the park centroid (EPSG:26915 is          ║
# ║               no longer hardcoded) — venue-generic in CRS.                    ║
# ║   R1.7/R2.6  check-intent.py species matching uses \b word boundaries.        ║
# ║   R2.1/R3.2  Gate self-test covers ALL SIX gates with matched negative        ║
# ║               fixtures (schema, grounding, naming added); the log            ║
# ║               records one NEG/POS line per gate; the validation              ║
# ║               counts six of each.                                             ║
# ║   R2.3/R3.7  query_hash is PER-SEGMENT and reproducible:                     ║
# ║               sha256(WKT ‖ canonical params); the page gate checks the        ║
# ║               page's hash against ITS segment's manifest entry.               ║
# ║   R2.4       Occurrence IDs are checked against the writer's OWN              ║
# ║               segment's pinned set — not the park-wide union.                 ║
# ║   R2.5       GBIF pages through endOfRecords (cap 600); truncation            ║
# ║               RECORDED in the manifest, never silent; UA + retry on           ║
# ║               Overpass.                                                       ║
# ║   R2.7/R3.8  Writer isolation is PHYSICAL: M7b stages each writer's          ║
# ║               complete input world into staging/writer-N/; the control        ║
# ║               staging provably contains no conventions bytes (checked          ║
# ║               against conventions.sha256); M8 validation re-asserts           ║
# ║               per instance.                                                   ║
# ║   R2.8/R3.9  naming REMOVED from the per-writer floor (it was                ║
# ║               structurally dead: both arms were gated to 1.0). The            ║
# ║               floor is schema/grounding/alttext/paragraph/headings;           ║
# ║               naming is measured at M9 where it can discriminate.             ║
# ║   R2.9       ks_paragraph REPLACED by paragraph_cv_ratio (control CV /        ║
# ║               treatment CV) — directional, no underpowered p-test.            ║
# ║   R2.10      ALL verdict thresholds live in thresholds.yaml; the join         ║
# ║               reads no code constants.                                        ║
# ║   R2.11/R3.10 Verdict ordering fixed: M10 builds the evidence page            ║
# ║               WITHOUT a verdict; M13 derives the verdict, appends it          ║
# ║               to the evidence page, REBUILDS, REDEPLOYS, and re-runs          ║
# ║               the live gates — the SERVED artifact carries the final          ║
# ║               mechanically derived verdict.                                   ║
# ║   R2.12/R3.11 Pages deploy from repo ROOT (source[path]=/) — the only        ║
# ║               branch-source config GitHub accepts; /site was 422.             ║
# ║   R2.13      Control pages are NEVER committed: the deploy repo               ║
# ║               contains only site/ output + .nojekyll.                         ║
# ║   R2.14/R3.12 A writer that cannot satisfy the floor records an              ║
# ║               honest "GATE_RESULT: FAIL" in gates.log instead of             ║
# ║               silently vanishing; M9 measures over passing pages             ║
# ║               only, and n<4 derives INCONCLUSIVE — the class is              ║
# ║               genuinely reachable.                                            ║
# ║   R2.15/R3.3 Live gates repaired: heading skips caught in BOTH                ║
# ║               directions; segment pages with zero images FAIL the            ║
# ║               alt gate (schema guarantees ≥1 figure); variant read            ║
# ║               from body[data-variant] rendered from frontmatter —            ║
# ║               never guessed from a URL.                                       ║
# ║   R2.16/R3.4 Second model family CAST: the conventions red-team              ║
# ║               reviser (M6b) and the final evaluator (M13) run on             ║
# ║               codex-cli (GPT family) — family B ≠ the authoring family        ║
# ║               (claude-code → GLM), per the attested-merge-gate /              ║
# ║               unprimed-falsifier corpus standard.                             ║
# ║   R2.17      Matched pairs are ANALYZED, not discarded: drift.py emits        ║
# ║               a pair_analysis block (per-pair deltas) the evaluation          ║
# ║               must report.                                                    ║
# ║   R3.13      M0 verifies gh AUTHORIZATION (login == github_owner) and         ║
# ║               refuses a pre-existing target repo unless                       ║
# ║               allow_repo_reuse=true; deploy re-verifies at the                ║
# ║               irreversible moment (Gas-Free Certificate).                     ║
# ║   R3.14      Header/config reconciled: retry is max_retries:1 (no            ║
# ║               fail_fast key is claimed anywhere).                             ║
# ║   R3.15      Citation sweep rebuilt: no blanket exemptions; cited             ║
# ║               paths stripped before the digit test; table rows must           ║
# ║               sit under a cited caption.                                      ║
# ║   R1.8       check-page.py strips ONLY the frontmatter block                  ║
# ║               (non-greedy, anchored) — a thematic break in the body          ║
# ║               can no longer eat the page.                                     ║
# ║                                                                               ║
# ║  COMPOSING       : Prefabrication (M5 freeze, enforced by digest),           ║
# ║                    Mission Command (M7 intent; \b-anchored refusal of         ║
# ║                    species names / segment IDs), The Etiquette Law           ║
# ║                    (every claim an exit code; the ENTIRE substrate           ║
# ║                    heredoc-authored — including the freeze script            ║
# ║                    pass 1 ghosted), Shipyard Sequence (M0–M4:                ║
# ║                    foundation validated before any LLM spend),               ║
# ║                    Unprimed Falsifier discipline (thresholds                 ║
# ║                    PRE-REGISTERED at M7b; mtime-checked at M9),              ║
# ║                    Red Team / Blue Team (M6b, family-B instrument),          ║
# ║                    Rehearsal Spotlight (check-synthesis.py proves            ║
# ║                    unflagged sections byte-identical), Proof-Carrying        ║
# ║                    Artifact + Validity Window (pinned GBIF bytes;            ║
# ║                    reproducible per-segment query hashes), Declared          ║
# ║                    Window (live gates scoped to fetched bytes),              ║
# ║                    Gas-Free Certificate (deploy re-runs the M0 repo           ║
# ║                    safety check at the irreversible moment).                 ║
# ║                                                                               ║
# ║  PROBLEM SOLVED  : Interpretive wayside guides for a real trail network       ║
# ║                    — "The Wayside Library" at Ledges State Park (Boone      ║
# ║                    County, Iowa): real OSM trail geometry clipped to the      ║
# ║                    park polygon, real GBIF occurrences with computed         ║
# ║                    phenology windows, CCC-era history and an embedded        ║
# ║                    Pennsylvanian stratigraphy vocabulary, landing as a       ║
# ║                    deployed, public, mobile-first static site a family       ║
# ║                    with 1 bar of signal can actually use. The                ║
# ║                    coordination problem is pure Barn Raising: without        ║
# ║                    shared conventions, eight independently-reasoning         ║
# ║                    writers produce eight reasonable pages that read          ║
# ║                    like eight organizations wrote them. With                 ║
# ║                    conventions, the merge is boring. Boring merges           ║
# ║                    are the win condition.                                    ║
# ║                                                                               ║
# ║  PRODUCES        : <auto-workspace>/wayside-library/ → run/ (meta.json,      ║
# ║                    assignment.json, drift-report.json, verdict.json,         ║
# ║                    deployment.json, live-gates.json, gates.log),             ║
# ║                    fixtures/ (1 known-good + 6 matched corruptions +         ║
# ║                    fixture grounding manifest), geometry/ (raw-ways,         ║
# ║                    park.geojson, segments.geojson, per-segment WGS84         ║
# ║                    WKT polygons, geometry.sha256), grounding/ (pinned        ║
# ║                    occurrence bytes per segment + manifest +                 ║
# ║                    phenology.json + stratigraphy vocab), schema/ +           ║
# ║                    schema.sha256 (frozen), conventions.md + .sha256,         ║
# ║                    intent.md, staging/writer-1..8/ (physically               ║
# ║                    isolated input worlds), pages/treatment|control/          ║
# ║                    (writer-tagged namespaces), site-src/ + site/             ║
# ║                    (merged content, shared glossary, evidence page           ║
# ║                    carrying the drift report AND the final verdict),         ║
# ║                    evaluation.md, and the LIVE GitHub Pages site             ║
# ║                    the live gates prove serves the built bytes.              ║
# ║                                                                               ║
# ║  INSTRUMENTS     : 9 of 16 movements are instrument:cli with EMPTY           ║
# ║                    fallback chains. Judgment movements: claude-code          ║
# ║                    (family A: schema M5, conventions M6a, intent M7,         ║
# ║                    writers M8, synthesis M10) and codex-cli                  ║
# ║                    (family B: red-team revise M6b, evaluation prose          ║
# ║                    M13) — two AI families, anti-self-review per             ║
# ║                    the corpus standard.                                       ║
# ║                                                                               ║
# ║  PREREQUISITES   : network (Overpass, GBIF, GitHub); python3 + venv          ║
# ║                    (pandas, scipy, shapely, pyproj, jsonschema,             ║
# ║                    textstat, requests, pyyaml, markdown); gh                 ║
# ║                    AUTHORIZED (login == github_owner, probed at M0           ║
# ║                    AND re-verified at deploy); codex-cli present             ║
# ║                    (probed at M0). NO mdbook, NO linkchecker, NO             ║
# ║                    pa11y — the build and link check are pip-installable      ║
# ║                    Python. Duration ≈ 1–2 h. Cost ≈ $2–5.                    ║
# ║                    Retry: max_retries 1 — gates fail loudly for              ║
# ║                    diagnosis, not blind retry. A FALSIFIED verdict is        ║
# ║                    a FINDING, not a crash; all four verdict classes          ║
# ║                    exit 0. Only mechanical failure exits nonzero.            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: wayside-library
description: "Barn Raising proof (r2): two-arm fan-out of 8 wayside-page writers over real GBIF/OSM grounding; conventions vs schema-only, drift measured deterministically, verdict shipped inside the deployed artifact"

# workspace: intentionally omitted — auto-managed at <workspace-root>/wayside-library.
# The score is GENERIC: park, OSM relation, mileage, endpoints, thresholds, deploy
# target, and repo-reuse policy are variables; M0 writes them to run/meta.json and
# every script reads disk (never a hardcoded park). The UTM zone is derived from
# the park centroid at M2 — no hardcoded CRS.

instruments:
  # Family B seat: the shipped codex profile, as a score alias — the
  # conventions red-team reviser (M6b) and the evaluator (M13) run on a
  # model family that did not author the artifact under review. Same
  # anti-self-review discipline as the-attested-merge-gate / the-unprimed-
  # falsifier ("family B ≠ writer family — mandatory anti-fraud").
  codex-redteam:
    profile: codex-cli
    config:
      timeout_seconds: 2700

instrument: claude-code            # score default (family A)
instrument_config:
  timeout_seconds: 1800

movements:
  # ── M0 · Scaffold (Shipyard Sequence / Tool Chain) ─────────────────────────────
  1:
    name: "Scaffold + Deterministic Substrate (M0)"
    instrument: cli            # bash + git + python venv: workspace init, meta
    instrument_fallbacks: []   # pin, deps lock, and the ENTIRE gate suite
    instrument_config:         # heredoc-authored here — gates.sh, check-page.py,
      timeout_seconds: 2700    # check-schema-freeze.py (pass 1 ghosted it),
                               # build-site.py, check-links.py. Probes (gh
                               # AUTHORIZATION, codex, venv deps, Overpass)
                               # fail LOUDLY before any LLM spend.
  # ── M1 · Gate self-test (The Etiquette Law, second clause) ─────────────────────
  2:
    name: "Gate Self-Test (M1)"
    instrument: cli            # gates.sh --self-test: ALL SIX gates must PASS
    instrument_fallbacks: []   # the known-good fixture AND FAIL their matched
    instrument_config:         # corruption. Six NEG lines, six POS lines.
      timeout_seconds: 900     # Validates the validators BEFORE anything runs.
  # ── M2 · Trail geometry (deterministic foundation) ─────────────────────────────
  3:
    name: "Trail Geometry (M2)"
    instrument: cli            # Overpass (park relation + clipped trails) +
    instrument_fallbacks: []   # shapely/pyproj: connected-component segments,
    instrument_config:         # UTM zone from centroid, WGS84 WKT out,
      timeout_seconds: 1500    # closed rings, pinned sha256. The mileage gate
                               # ties geometry to published reality (±20%).
  # ── M3 · GBIF grounding with pins (Proof-Carrying Artifact) ────────────────────
  4:
    name: "GBIF Grounding + Phenology (M3)"
    instrument: cli            # requests (GBIF, paged to endOfRecords) +
    instrument_fallbacks: []   # pandas: per-polygon pinned occurrences,
    instrument_config:         # reproducible per-segment query hashes, phenology
      timeout_seconds: 1800    # IQR windows, embedded stratigraphy vocabulary.
                               # Thin-record segments degrade to whole-park —
                               # RECORDED, never silent.
  # ── M4 · Stratified arm assignment (the confound-killer) ───────────────────────
  5:
    name: "Stratified Arm Assignment (M4)"
    instrument: cli            # python3: sort → adjacent PAIRING (no brittle
    instrument_fallbacks: []   # ratio asserts), seeded arm flip within pair,
    instrument_config:         # pinned assignment.json. Must PREDATE all
      timeout_seconds: 600     # writing — enforced by mtime at M9.
  # ── M5 · Prefabrication freeze: page schema (LLM — judgment, family A) ─────────
  6:
    name: "Page Schema Freeze (M5)"
    instrument: claude-code    # Contract authorship reasons about interfaces
    instrument_fallbacks: []   # that do not exist yet — judgment. The SEED
    instrument_config:         # schema is strict (no empty taxa/figures); the
      timeout_seconds: 1800    # author may only STRENGTHEN it. Frozen on
                               # completion by the M0-authored freeze script;
                               # a post-freeze edit fails the digest check.
  # ── M6 · Conventions + red-team revise (LLM — two families) ────────────────────
  7:
    name: "Conventions Authorship (M6a)"
    instrument: claude-code    # Family A authors the judgment-bearing
    instrument_fallbacks: []   # convention layer: voice, heading grammar,
    instrument_config:         # glossary discipline, naming, alt-text style,
      timeout_seconds: 2700    # cultural sensitivity, density.
  8:
    name: "Conventions Red-Team Revise (M6b)"
    instrument: codex-redteam  # FAMILY B (GPT via codex-cli) attacks what
    instrument_fallbacks: []   # family A wrote — anti-self-review. Attack
    instrument_config:         # from BOTH edges (too vague / too rigid), then
      timeout_seconds: 2700    # revise. Then the CLI partition check: every
                               # rule gate-backed or judgment-only; zero
                               # unclassified.
  # ── M7 · Mission Command: intent envelope (LLM — judgment, family A) ───────────
  9:
    name: "Intent Envelope (M7)"
    instrument: claude-code    # PURPOSE / KEY TASKS / END STATE without
    instrument_fallbacks: []   # prescribing content per segment. The CLI check
    instrument_config:         # REFUSES any species name (\b-anchored) or
      timeout_seconds: 1200    # segment ID.
  # ── M7b · Pre-register thresholds + stage writer worlds (CLI) ──────────────────
  10:
    name: "Pre-Register Thresholds + Stage Writers (M7b)"
    instrument: cli            # thresholds.yaml written AFTER the writers'
    instrument_fallbacks: []   # inputs exist and BEFORE any writer runs
    instrument_config:         # (mtime-checked at M9) — ALL verdict constants
      timeout_seconds: 900     # live HERE, none in code. Then each writer's
                               # input world is STAGED into staging/writer-N/;
                               # control staging contains no conventions bytes.
  # ── M8 · The two-arm fan-out — THE EXPERIMENT (LLM ×8, family A) ───────────────
  11:
    name: "Writers: Two-Arm Fan-Out (M8)"
    instrument: claude-code    # 8 instances, 2 arms of 4, physically staged
    instrument_fallbacks: []   # input worlds. Treatment: conventions + schema
    instrument_config:         # + intent + grounding. Control: schema + intent
      timeout_seconds: 3600    # + grounding ONLY. Floor gates: schema,
                               # grounding, alttext, paragraph, headings —
                               # NOT naming (measured at M9; gating it in the
                               # floor made the metric structurally dead).
                               # A writer that cannot pass records an honest
                               # FAIL in gates.log; INCONCLUSIVE is reachable.
  # ── M9 · Deterministic drift measurement (the heart of the proof) ──────────────
  12:
    name: "Drift Measurement (M9)"
    instrument: cli            # Pure CLI: grammar agreement, glossary adoption,
    instrument_fallbacks: []   # naming compliance (MEASURED, not floor-gated),
    instrument_config:         # FK spread, directional paragraph-CV ratio.
      timeout_seconds: 900     # Self-tests against fixtures; mtime-verifies
                               # pre-registration; emits per-arm AND per-pair
                               # analysis. Any LLM here would invalidate the
                               # proof's central claim.
  # ── M10 · Editorial synthesis — treatment arm only (LLM — judgment, family A) ──
  13:
    name: "Editorial Synthesis (M10)"
    instrument: claude-code    # Merge treatment pages, shared glossary,
    instrument_fallbacks: []   # cross-links; argued resolution, recorded
    instrument_config:         # dissent. Rehearsal Spotlight: unflagged
      timeout_seconds: 2700    # sections byte-identical (normalized H2
                               # matching). The evidence page carries the
                               # drift tables and thresholds but NOT the
                               # verdict — the verdict does not exist yet
                               # (producer before consumer, fixed in r2).
                               # Control pages are NEVER shipped.
  # ── M11 · Build + deploy (deterministic) ──────────────────────��────────────────
  14:
    name: "Build + Deploy (M11)"
    instrument: cli            # build-site.py (python-markdown, variant
    instrument_fallbacks: []   # stamped into <body data-variant>), check-
    instrument_config:         # links.py over the local build, then a CLEAN
      timeout_seconds: 1800    # git repo containing ONLY site/ + .nojekyll
                               # (control pages never committed), pushed to
                               # the fenced target; Pages source[/]=/ main —
                               # the only branch config GitHub accepts.
  # ── M12 · Live gates on the deployed bytes (Declared Window) ───────────────────
  15:
    name: "Live Gates (M12)"
    instrument: cli            # Deterministic Python over SERVED HTML: alt
    instrument_fallbacks: []   # (zero-image segment pages FAIL — schema
    instrument_config:         # guarantees ≥1 figure), lang, viewport,
      timeout_seconds: 2400    # heading order (both directions), grade bands
                               # by frontmatter variant (never URL-guessed),
                               # page weight, served-vs-built equality.
  # ── M13 · Verdict + evidence update + evaluation ───────────────────────────────
  16:
    name: "Verdict + Evidence Update + Evaluation (M13)"
    instrument: codex-redteam  # Family B writes the prose — the maker's
    instrument_fallbacks: []   # family never grades its own work. Step 1 is
    instrument_config:         # CLI regardless: the verdict class derives from
      timeout_seconds: 2700    # thresholds.yaml by exit-code arithmetic with
                               # NO prose intermediate. Then the evidence page
                               # is appended, the site REBUILT and REDEPLOYED,
                               # and live gates re-run — the SERVED artifact
                               # carries the final verdict.

sheet:
  size: 1
  total_items: 16           # movements pre-expansion; engine expands to 23 sheets
  fan_out:
    11: 8                   # the writers: 2 arms × 4 segments (sheets 12-19)
  dependencies:             # movement-keyed; engine expands to the sheet DAG
    2: [1]                  # self-test runs only on a commissioned substrate
    3: [2]                  # geometry trusts only self-tested gates
    4: [3]                  # grounding queries the validated polygons
    5: [4]                  # assignment stratifies on grounding reality
    6: [4]                  # schema needs taxa/occurrence shapes (∥ M6a/M7)
    7: [4, 6]               # conventions need grounding + the schema's grain
    8: [7]                  # family B attacks the family A draft
    9: [6, 7, 8]            # intent sits above schema + revised conventions
    10: [9]                 # pre-register + stage AFTER all writer inputs exist
    11: [10]                # CONSTITUTIONAL: registration precedes writing
    12: [11]                # drift measures the fan-out output
    13: [12]                # synthesis sees the measurement first
    14: [13]                # build ships the merged treatment arm only
    15: [14]                # live gates audit the DEPLOYED artifact
    16: [15]                # the verdict joins drift + live evidence, then ships

parallel:
  enabled: true
  max_concurrent: 4          # the eight writers run in parallel; judgment
                             # movements upstream serialize on the freeze

# cross_sheet: deliberately ABSENT — the workspace IS the shared memory, and
# the 8 writers must not see each other's output: isolation is the EXPERIMENTAL
# CONDITION, not an optimization. Writer inputs are PHYSICALLY partitioned into
# staging/writer-N/ at M7b and re-verified per instance at M8.

retry:
  max_retries: 1             # gates fail loudly for diagnosis, not blind retry;
  base_delay_seconds: 30     # a writer that still fails records an honest
                             # GATE_RESULT: FAIL in gates.log and its absence
                             # flows to INCONCLUSIVE via honest-n — partial
                             # failure is tolerated, silent loss is not

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800 # CLI movements run silent pandas/scipy fans

workspace_lifecycle:
  archive_on_fresh: false
  max_archives: 3

prompt:
  variables:
    # ── Venue inputs (overridable via --var; recorded to run/meta.json at M0,
    #    which is where every script reads them — never an unexpandable path)
    github_owner: "Mzzkc"
    repo_name: "wayside-library"
    allow_repo_reuse: "false"      # refuse a pre-existing target repo unless explicitly overridden
    park_name: "Ledges State Park"
    park_osm_type: "way"           # OSM element type of the park boundary
    park_osm_id: "36830786"        # OSM way 36830786 = Ledges State Park
                                   # boundary (boundary=state_park; verified
                                   # via Nominatim + Overpass tags — pass 1's
                                   # relation 912934 was a German farmland
                                   # area, and its 13.0 km figure matched
                                   # nothing inside the real park)
    expected_trail_km: "7.0"       # OSM-OBSERVED path|footway|steps network
                                   # length clipped to the park polygon
                                   # (6.99 km measured live 2026-10-26;
                                   # path 6.74 + steps 0.25; service roads
