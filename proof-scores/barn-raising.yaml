    cat > scripts/check-assignment.py <<'PEOF'
    #!/usr/bin/env python3
    """Structure check: pairs are disjoint and cover all segments; seed
    pinned; each pair's strata recorded; the assignment file predates any
    writer output (mtime evidence — the confound killed on the record)."""
    import glob, json, os, sys
    HERE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
    a = json.load(open(os.path.join(HERE, "run/assignment.json")))
    assert a.get("seed"), "seed not pinned"
    seen = []
    for p in a["pairs"]:
        seen.extend([p["treatment"], p["control"]])
        assert p["treatment"] != p["control"]
        assert len(p["strata"]["occurrence_count"]) == 2
        assert len(p["strata"]["length_km"]) == 2
    assert len(seen) == len(set(seen)), "a segment appears in two pairs"
    man = json.load(open(os.path.join(HERE, "grounding/grounding-manifest.json")))
    all_segs = {s["segment_id"] for s in man["segments"]}
    assert set(seen) == all_segs, "pairs do not cover all segments"
    a_mtime = os.path.getmtime(os.path.join(HERE, "run/assignment.json"))
    for page in glob.glob(os.path.join(HERE, "pages/*/*/page.md")):
        assert os.path.getmtime(page) > a_mtime, \
            f"page {page} predates the assignment — confound not killed"
    print("ASSIGNMENT OK: disjoint full-cover pairs, seed pinned, predates writing")
    PEOF
