    # ── scripts/build-site.py + check-links.py (r2: no mdbook/linkchecker) ─
    cat > scripts/build-site.py <<'BEOF'
    #!/usr/bin/env python3
    """Static site builder: python-markdown, one template, nav from a
    directory scan. Emits site/ with index.html, GLOSSARY.html, one page per
    site-src/content/<seg>/page.md, and evidence.html. The <body> carries
    data-variant from the page's frontmatter so the live gates never guess a
    variant from a URL. Exit-coded: any missing input is a failure."""
    import glob, os, re, sys
    import markdown, yaml

    HERE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
    SRC = os.path.join(HERE, "site-src")
    OUT = os.path.join(HERE, "site")

    # Token replacement (not str.format): the CSS braces stay literal —
    # the outer Jinja template must never see a doubled brace either.
    TEMPLATE = """<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@@TITLE@@</title>
    <style>body{max-width:42rem;margin:1rem auto;padding:0 .5rem;
    font-family:system-ui,sans-serif;line-height:1.5}nav a{margin-right:.75rem}
    img{max-width:100%}</style>
    </head>
    <body data-variant="@@VARIANT@@">
    <nav><a href="index.html">Library</a><a href="GLOSSARY.html">Glossary</a>
    <a href="evidence.html">Evidence</a></nav>
    <main>
    @@BODY@@
    </main>
    </body>
    </html>
    """

    def render(md_path, title, variant):
        raw = open(md_path).read()
        m = re.match(r"\A---\n(.*?)\n---\n", raw, re.S)
        fm = yaml.safe_load(m.group(1)) if m else {}
        body_md = raw[m.end():] if m else raw
        # frontmatter figures become real <img> elements: a declared figure
        # that never renders would make the served alt gate vacuous (r2)
        # src/alt are musician-written frontmatter, so they are escaped and
        # src is held to the fig-<slug>.<ext> naming the M9 gate measures.
        from html import escape
        figs = "".join('<p><img src="%s" alt="%s"></p>\n'
                       % (escape(str(f["src"]), quote=True), escape(str(f.get("alt", "")), quote=True))
                       for f in fm.get("figures", [])
                       if re.match(r"^fig-[a-z0-9-]+\.(jpg|png|webp)$", str(f.get("src", ""))))
        html = markdown.markdown(body_md, extensions=["tables"]) + figs
        return (TEMPLATE.replace("@@TITLE@@", title)
                        .replace("@@VARIANT@@", variant)
                        .replace("@@BODY@@", html))

    def main():
        assert os.path.isdir(SRC), "no site-src/"
        os.makedirs(OUT, exist_ok=True)
        pages = []
        index = os.path.join(SRC, "index.md")
        assert os.path.isfile(index), "no site-src/index.md"
        open(os.path.join(OUT, "index.html"), "w").write(
            render(index, "The Wayside Library", "index"))
        for g in sorted(glob.glob(os.path.join(SRC, "content", "*", "page.md"))):
            seg = os.path.basename(os.path.dirname(g))
            raw = open(g).read()
            fm = yaml.safe_load(re.match(r"\A---\n(.*?)\n---\n", raw, re.S).group(1))
            dst = os.path.join(OUT, seg + ".html")
            open(dst, "w").write(render(g, fm.get("title", seg), fm.get("variant", "family")))
            pages.append(seg)
        for name in ("GLOSSARY.md", "evidence.md"):
            p = os.path.join(SRC, name)
            assert os.path.isfile(p), "missing site-src/%s" % name
            open(os.path.join(OUT, name.replace(".md", ".html")), "w").write(
                render(p, name.replace(".md", ""), "meta"))
        open(os.path.join(OUT, ".nojekyll"), "w").write("")
        print("SITE BUILT: index + %s + glossary + evidence" % ", ".join(pages))

    if __name__ == "__main__":
        main()
