    """Every pinned file's sha256 matches the manifest; every query hash
    RE-DERIVES from the recorded WKT + canonical params (reproducible — a
    page citing the hash cites a query that can be re-run); every >=5-record
    species' phenology window RECOMPUTES from the pinned bytes; every
    segment declares granularity AND truncation (downgrades visible)."""
    import hashlib, json, os, re, statistics, sys
    HERE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
    man = json.load(open(os.path.join(HERE, "grounding/grounding-manifest.json")))
    pheno = json.load(open(os.path.join(HERE, "grounding/phenology.json")))
    for seg in man["segments"]:
        assert seg.get("granularity") in ("segment", "whole-park-downgrade"), \
            f"{seg['segment_id']}: granularity not declared"
        assert isinstance(seg.get("truncated"), bool), \
            f"{seg['segment_id']}: truncation not declared"
        # query hash reproducibility (the r2 fix for hash semantics)
        expect = hashlib.sha256(
            (seg["query_wkt"] + "|" + man["params"]).encode()).hexdigest()
        assert seg["query_hash"] == expect, \
            f"{seg['segment_id']}: query hash not reproducible from WKT"
        raw = open(os.path.join(HERE, seg["path"]), "rb").read()
        assert hashlib.sha256(raw).hexdigest() == seg["sha256"], \
            f"{seg['segment_id']}: pin mismatch"
        recs = json.loads(raw).get("results", [])
        by = {}
        for r in recs:
            mo = (int(r["month"]) if r.get("month") else
                  (int(m.group(1)) if (m := re.match(r"^\d{4}-(\d{2})", r.get("eventDate") or "")) else None))
            if mo and r.get("scientificName"):
                by.setdefault(r["scientificName"], []).append(mo)
        for sci, mos in by.items():
            if len(mos) >= 5:
                assert sci in pheno[seg["segment_id"]], \
                    f"{seg['segment_id']}/{sci}: >=5 records but no window"
                q = statistics.quantiles(mos, n=4)
                expect = "%d-%d" % (int(q[0]), int(q[2]))
                assert pheno[seg["segment_id"]][sci]["window"] == expect, \
                    f"{seg['segment_id']}/{sci}: window not reproducible"
    print("GROUNDING OK: pins verify, query hashes reproducible, phenology reproducible")
