    # ── scripts/check-page.py — per-page gate implementations ──────────────
    # r2: frontmatter stripping is NON-GREEDY and anchored (a `---` thematic
    # break in the body can no longer eat the page); grounding is scoped to
    # the page's OWN segment with a reproducible per-segment query hash;
    # geology terms are checked against the pinned vocabulary.
    cat > scripts/check-page.py <<'PEOF'
    #!/usr/bin/env python3
    """Per-page gates: --schema --grounding --alttext --paragraph --headings
    --naming. Deterministic, exit-coded, empty fallback chain: a gate that
    cannot run is a FAILURE, never a pass."""
    import argparse, os, re, sys
    import yaml

    HERE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))

    def load_page(path):
        raw = open(path).read()
        m = re.match(r"\A---\n(.*?)\n---\n", raw, re.S)   # anchored, non-greedy
        if not m:
            sys.exit("NO FRONTMATTER: %s" % path)
        return yaml.safe_load(m.group(1)), raw[m.end():]

    def gate_schema(path):
        import json, jsonschema
        fm, _ = load_page(path)
        schema = json.load(open(os.path.join(HERE, "schema/page-schema.json")))
        jsonschema.validate(fm, schema)

    def gate_grounding(path):
        import json
        fm, _ = load_page(path)
        man_path = os.environ.get("GROUNDING_MANIFEST",
                                  os.path.join(HERE, "grounding/grounding-manifest.json"))
        man = json.load(open(man_path))
        segs = {s["segment_id"]: s for s in man["segments"]}
        seg = segs.get(str(fm.get("segment_id")))
        if seg is None:
            sys.exit("UNKNOWN SEGMENT %s in %s" % (fm.get("segment_id"), path))
        # per-segment query hash: the page must cite the query that produced
        # ITS records (reproducible: sha256 over WKT + canonical params)
        if str(fm.get("gbif_query_hash", "")) != str(seg["query_hash"]):
            sys.exit("QUERY HASH MISMATCH in %s: page cites %r, segment pin is %r"
                     % (path, fm.get("gbif_query_hash"), seg["query_hash"]))
        occ = set(str(r) for r in seg["occurrence_ids"])
        for taxon in fm.get("taxa", []):
            for oid in taxon.get("occurrence_ids", []):
                if str(oid) not in occ:
                    sys.exit("UNPINNED OCCURRENCE %s in %s (not in segment %s)"
                             % (oid, path, seg["segment_id"]))
        # geology terms must come from the pinned vocabulary (term-level
        # entailment — hashing the source proves custody, not this)
        vocab = set(t.strip().lower()
                    for t in open(os.path.join(
                        os.path.dirname(man_path),
                        "stratigraphy-vocab.txt")).read().splitlines()
                    if t.strip() and not t.startswith("#"))
        for term in fm.get("geology_terms", []):
            if str(term).strip().lower() not in vocab:
                sys.exit("GEOLOGY TERM NOT IN PINNED VOCAB: %r in %s" % (term, path))

    def gate_alttext(path):
        fm, _ = load_page(path)
        for i, fig in enumerate(fm.get("figures", [])):
            alt = str(fig.get("alt", ""))
            if len(alt.strip()) < 8:
                sys.exit("FRONTMATTER ALT TEXT < 8 CHARS on figure %d in %s" % (i, path))
        _, body = load_page(path)
        for i, m in enumerate(re.finditer(r"!\[([^\]]*)\]\([^)]+\)", body)):
            if not m.group(1).strip():
                sys.exit("EMPTY MARKDOWN ALT TEXT on image %d in %s" % (i, path))

    def gate_paragraph(path):
        _, body = load_page(path)
        for para in re.split(r"\n\s*\n", body):
            if para.startswith("#") or para.startswith("!["):
                continue
            words = para.split()
            if len(words) > 120:
                sys.exit("PARAGRAPH > 120 WORDS (%d) in %s" % (len(words), path))

    def gate_headings(path):
        _, body = load_page(path)
        h1 = re.findall(r"^# ", body, re.M)
        if len(h1) != 1:
            sys.exit("H1 COUNT != 1 in %s" % path)
        prev = 1
        for m in re.finditer(r"^(#{2,6}) ", body, re.M):
            lvl = len(m.group(1))
            if lvl > prev + 1:
                sys.exit("HEADING SKIP: H%d after H%d in %s" % (lvl, prev, path))
            prev = lvl

    def gate_naming(dirpath):
        for root, _, files in os.walk(dirpath):
            for f in files:
                if f.endswith(".md") and not re.match(r"^(page|GLOSSARY)\.md$", f):
                    sys.exit("NAMING VIOLATION: %s in %s" % (f, root))
                if re.search(r"\.(jpg|jpeg|png|webp|gif)$", f) \
                   and not re.match(r"^fig-[a-z0-9-]+\.", f):
                    sys.exit("FIGURE NAMING VIOLATION: %s in %s" % (f, root))

    if __name__ == "__main__":
        ap = argparse.ArgumentParser()
        ap.add_argument("--schema", metavar="P"); ap.add_argument("--grounding", metavar="P")
        ap.add_argument("--alttext", metavar="P"); ap.add_argument("--paragraph", metavar="P")
        ap.add_argument("--headings", metavar="P"); ap.add_argument("--naming", metavar="D")
        a = ap.parse_args()
        if a.schema: gate_schema(a.schema)
        elif a.grounding: gate_grounding(a.grounding)
        elif a.alttext: gate_alttext(a.alttext)
        elif a.paragraph: gate_paragraph(a.paragraph)
        elif a.headings: gate_headings(a.headings)
        elif a.naming: gate_naming(a.naming)
    PEOF
    chmod +x scripts/check-page.py

    # ── scripts/gates.sh — the shared gate front door ──────────────────────
    # r2: --page runs the FLOOR (schema grounding alttext paragraph headings
    # — NOT naming: naming is a drift METRIC and was structurally dead when
    # both arms were floor-gated to 1.0). --self-test covers ALL SIX gates,
    # each with a matched negative fixture, and logs one NEG + one POS line
    # per gate so the M1 validation can count teeth (6 and 6).
    cat > scripts/gates.sh <<'GEOF'
    #!/usr/bin/env bash
    # Wayside Library gate front door:
    #   --self-test | --list | --page <path> [--with-naming]
    set -euo pipefail
    HERE="$(cd "$(dirname "$0")/.." && pwd)"
    PY="$HERE/.venv/bin/python"
    GATE() { "$PY" "$HERE/scripts/check-page.py" "$1" "$2"; }
    WITH_NAMING=0
    if [ "${3:-}" = "--with-naming" ]; then WITH_NAMING=1; fi

    case "${1:-}" in
      --list) echo "schema grounding alttext paragraph headings naming"; exit 0;;
      --page)
        P="$2"
        for g in schema:--schema grounding:--grounding alttext:--alttext \
                 paragraph:--paragraph headings:--headings; do
          name="${g%%:*}"; flag="${g##*:}"
          GATE "$flag" "$P" || { echo "GATE $name FAILED on $P"; exit 1; }
        done
        if [ "$WITH_NAMING" = "1" ]; then
          GATE --naming "$(dirname "$P")" || { echo "GATE naming FAILED on $P"; exit 1; }
        fi
        echo "ALL PAGE GATES PASS on $P";;
      --self-test)
        export GROUNDING_MANIFEST="$HERE/fixtures/grounding-manifest.json"
        GOOD=fixtures/known-good/page.md
        neg() { # gate-flag fixture name — the corruption MUST fail the gate
          if GATE "$1" "$2" >/dev/null 2>&1; then
            echo "SELF-TEST FAIL: $3 gate cannot fail"; exit 1
          else
            echo "NEG $3: corruption rejected as designed"
          fi
        }
        pos() { # gate-flag target name
          if GATE "$1" "$2" >/dev/null 2>&1; then
            echo "POS $3: known-good passes"
          else
            echo "SELF-TEST FAIL: $3 gate cannot pass the known-good page"; exit 1
          fi
        }
        neg --headings fixtures/corrupt-heading-skip/page.md headings
        neg --alttext fixtures/corrupt-missing-alttext/page.md alttext
        neg --paragraph fixtures/corrupt-long-paragraph/page.md paragraph
        neg --schema fixtures/corrupt-schema/page.md schema
        neg --grounding fixtures/corrupt-grounding/page.md grounding
        neg --naming fixtures/corrupt-naming naming
        pos --schema "$GOOD" schema
        pos --grounding "$GOOD" grounding
        pos --alttext "$GOOD" alttext
        pos --paragraph "$GOOD" paragraph
        pos --headings "$GOOD" headings
        pos --naming fixtures/known-good naming
        echo "SELF-TEST PASS: all six gates can pass AND fail";;
      *) echo "usage: gates.sh --self-test|--list|--page <path> [--with-naming]"; exit 2;;
    esac
    GEOF
    chmod +x scripts/gates.sh

    # ── scripts/check-schema-freeze.py — AUTHORED HERE (pass 1 ghosted it) ──
    cat > scripts/check-schema-freeze.py <<'SEOF'
    #!/usr/bin/env python3
    """Freeze or verify the page schema. Modes:
       --freeze : write schema.sha256 + record the digest in run/meta.json
       --verify : refuse unless the digest matches (post-freeze edit = fail)
    The freeze script itself is deterministic and score-resident — no LLM
    movement ever authors it."""
    import argparse, hashlib, json, os, sys
    HERE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
    SCHEMA = os.path.join(HERE, "schema/page-schema.json")
    PIN = os.path.join(HERE, "schema.sha256")

    def digest():
        return hashlib.sha256(open(SCHEMA, "rb").read()).hexdigest()

    if __name__ == "__main__":
        ap = argparse.ArgumentParser()
        ap.add_argument("--freeze", action="store_true")
        ap.add_argument("--verify", action="store_true")
        a = ap.parse_args()
        if a.freeze:
            h = digest()
            with open(PIN, "w") as f:
                f.write("%s  schema/page-schema.json\n" % h)
            meta_path = os.path.join(HERE, "run/meta.json")
            meta = json.load(open(meta_path))
            meta["schema_sha256"] = h
            meta["schema_frozen_at"] = __import__("time").strftime(
                "%Y-%m-%dT%H:%M:%SZ", __import__("time").gmtime())
            json.dump(meta, open(meta_path, "w"), indent=2)
            print("SCHEMA FROZEN: %s" % h[:16])
        elif a.verify:
            pinned = [l.split()[0] for l in open(PIN)][0].strip()
            assert digest() == pinned, \
                "schema digest mismatch — post-freeze edit detected"
            print("SCHEMA FREEZE VERIFIED")
        else:
            ap.error("choose --freeze or --verify")
    SEOF
    chmod +x scripts/check-schema-freeze.py

    # ── Seed schema + FULL fixture corpus: six matched negative controls ───
