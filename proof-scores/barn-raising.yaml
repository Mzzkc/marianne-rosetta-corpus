    #!/usr/bin/env python3
    """Cross-arm drift measurement. Five metrics, each DIRECTIONAL toward
    treatment benefit:
      grammar_agreement — fraction of section paths shared by >=2 pages of
                          the arm (cross-writer heading-grammar agreement)
      glossary_adoption — mean fraction of glossary terms used >=2x per page
      naming_compliance — fraction of files conforming to naming patterns
                          (MEASURED ONLY — never floor-gated; r2)
      fk_grade_spread — stddev of Flesch-Kincaid grade across an arm's pages
      paragraph_cv_ratio — control CV / treatment CV of paragraph lengths
                          (directional replacement for the underpowered
                          two-sample KS of pass 1; r2)
    Modes: --selftest (identical -> zero deltas, divergent -> large)
           --run --out FILE (measure pages/, verify pre-registration mtimes,
                             honest-n from gates.log, pair analysis)
    Empty fallback chain: any missing input is a FAILURE."""
    import argparse, glob, json, math, os, re, statistics, sys
    from collections import Counter
    import yaml

    GLOSSARY_FALLBACK = ["Pennsylvanian", "phenology", "loess"]

    def pages(arm, root="."):
        return sorted(glob.glob(os.path.join(root, f"pages/{arm}/*/page.md")))

    def passing_pages(arm, root="."):
        """Pages of writers whose gates.log line records PASS (r2: a
        recorded FAIL removes the page from measurement — honest-n)."""
        allp = pages(arm, root)
        log = os.path.join(root, "gates.log")
        if not os.path.exists(log):
            return allp
        failed = set()
        for line in open(log):
            m = re.match(r"GATE_RESULT: FAIL (writer-\S+) (\S+)", line)
            if m:
                failed.add(m.group(1))
        return [p for p in allp
                if not any(f in p for f in failed)] or allp

    def body_of(path):
        raw = open(path).read()
        m = re.match(r"\A---\n.*?\n---\n", raw, re.S)
        return raw[m.end():] if m else raw

    def heading_paths(body):
        """SECTION GRAMMAR: full heading paths minus the page-specific H1
        prefix. Live-tested (r2): full-path entropy is dominated by the
        unique H1 and normalizes to 1.0 for BOTH arms — a metric that
        cannot discriminate. The grammar after the H1 is what conventions
        align: treatment writers repeat section grammars, drifting
        writers do not."""
        paths, stack = [], []
        for m in re.finditer(r"^(#{1,6}) (.+)$", body, re.M):
            lvl = len(m.group(1))
            while stack and stack[-1][0] >= lvl:
                stack.pop()
            stack.append((lvl, m.group(2).strip().lower()))
            paths.append("/".join(t for _, t in stack))
        return [p.split("/", 1)[1] for p in paths if "/" in p]

    def grammar_agreement(page_list):
        """Cross-writer agreement: fraction of section-path instances that
        appear in >=2 pages of the arm. 1.0 = every section heading is
        shared with another writer; 0.0 = no writer repeats any section.
        (Live-tested r2: normalized entropy measures distribution BALANCE,
        not agreement — both arms scored 1.0 on deliberately divergent
        fixtures. This metric discriminates.)"""
        per_page = [set(heading_paths(body_of(p))) for p in page_list]
        allp = [q for s in per_page for q in s]
        if not allp:
            return 0.0
        shared = sum(1 for q in allp
                     if sum(q in s for s in per_page) >= 2)
        return shared / len(allp)

    def glossary_terms(root="."):
        cpath = os.path.join(root, "conventions.md")
        if os.path.exists(cpath):
            txt = open(cpath).read()
            m = re.search(r"##\s*Glossary(.*)", txt, re.S | re.I)
            if m:
                terms = re.findall(r"^\s*-\s+\*\*(.+?)\*\*", m.group(1), re.M)
                if terms:
                    return terms
        return GLOSSARY_FALLBACK

    def glossary_adoption(page_list, terms):
        if not page_list:
            return 0.0
        per_page = []
        for p in page_list:
            body = body_of(p)
            per_page.append(sum(1 for t in terms
                                if len(re.findall(re.escape(t), body, re.I)) >= 2)
                             / len(terms))
        return statistics.mean(per_page)

    def naming_compliance(arm, root="."):
        files = [f for f in glob.glob(os.path.join(root, f"pages/{arm}/**/*.*"),
                                      recursive=True)]
        if not files:
            return 0.0
        ok = 0
        for f in files:
            base = os.path.basename(f)
            if base == "page.md" or base == "GLOSSARY.md" \
               or re.match(r"^fig-[a-z0-9-]+\.(jpg|jpeg|png|webp|gif)$", base):
                ok += 1
        return ok / len(files)

    def fk_grades(page_list):
        import textstat
        return [textstat.flesch_kincaid_grade(body_of(p)) for p in page_list]

    def paragraph_lengths(page_list):
        out = []
        for p in page_list:
            body = body_of(p)
            out.extend(len(par.split()) for par in re.split(r"\n\s*\n", body)
                       if par.strip() and not par.startswith("#")
                       and not par.startswith("!["))
        return out

    def cv(xs):
        return (statistics.pstdev(xs) / statistics.mean(xs)) if xs and statistics.mean(xs) else 0.0

    def arm_of_page(path):
        return os.path.basename(os.path.dirname(os.path.dirname(path)))

    def measure(arms=("treatment", "control"), root="."):
        tp = passing_pages("treatment", root)
        cp = passing_pages("control", root)
        assert tp and cp, "an arm is empty after honest-failure filtering"
        ga_head = {a: grammar_agreement(p) for a, p in (("treatment", tp), ("control", cp))}
        terms = glossary_terms(root)
        ga = {a: glossary_adoption(p, terms) for a, p in (("treatment", tp), ("control", cp))}
        nc = {a: naming_compliance(a, root) for a in arms}
        fk = {a: statistics.pstdev(fk_grades(p)) for a, p in (("treatment", tp), ("control", cp))}
        cvr = (cv(paragraph_lengths(cp)) / cv(paragraph_lengths(tp))) \
            if cv(paragraph_lengths(tp)) > 0 else 0.0
        metrics = [
          {"metric": "grammar_agreement", "direction": "higher_is_better",
           "treatment": round(ga_head["treatment"], 4),
           "control": round(ga_head["control"], 4),
           "delta": round(ga_head["treatment"] - ga_head["control"], 4)},
          {"metric": "glossary_adoption", "direction": "higher_is_better",
           "treatment": round(ga["treatment"], 4), "control": round(ga["control"], 4),
           "delta": round(ga["treatment"] - ga["control"], 4)},
          {"metric": "naming_compliance", "direction": "higher_is_better",
           "treatment": round(nc["treatment"], 4), "control": round(nc["control"], 4),
           "delta": round(nc["treatment"] - nc["control"], 4)},
          {"metric": "fk_grade_spread", "direction": "lower_is_better",
           "treatment": round(fk["treatment"], 4), "control": round(fk["control"], 4),
           "delta": round(fk["control"] - fk["treatment"], 4)},
          {"metric": "paragraph_cv_ratio", "direction": "higher_is_better",
           "treatment": round(cv(paragraph_lengths(tp)), 4),
           "control": round(cv(paragraph_lengths(cp)), 4),
           "ratio": round(cvr, 4),
           "delta": round(cvr, 4)}]
        return {"arms": {"treatment": {"n": len(tp), "n_written": len(pages("treatment", root))},
                         "control": {"n": len(cp), "n_written": len(pages("control", root))}},
                "metrics": metrics, "glossary_terms": terms}

    def pair_analysis(root="."):
        """The matched pairs do analytical work (r2): per pair, heading-path
        Jaccard similarity between the pair's two pages."""
        a = json.load(open(os.path.join(root, "run/assignment.json")))
        out = []
        for p in a["pairs"]:
            tset = cset = None
            for page in pages("treatment", root):
                if os.path.basename(os.path.dirname(page)).endswith(p["treatment"]) or \
                   f'"{p["treatment"]}"' in open(page).read():
                    pass
            # resolve pages by frontmatter segment_id (robust to writer tags)
            def find(arm, seg):
                for page in pages(arm, root):
                    m = re.match(r"\A---\n(.*?)\n---", open(page).read(), re.S)
                    if m and "segment_id: %s" % seg in m.group(1):
                        return page
                return None
            tp, cp = find("treatment", p["treatment"]), find("control", p["control"])
            if tp and cp:
                ts = set(heading_paths(body_of(tp)))
                cs = set(heading_paths(body_of(cp)))
                inter = len(ts & cs); union = len(ts | cs) or 1
                out.append({"pair_id": p["pair_id"],
                            "treatment": p["treatment"], "control": p["control"],
                            "heading_jaccard": round(inter / union, 4)})
        return out

    def selftest(root="."):
        import shutil
        fx = os.path.join(root, "drift-fixtures")
        shutil.rmtree(fx, ignore_errors=True)
        FM = "---\nsegment_id: seg-%s\ntitle: T\nvariant: family\ntaxa:\n  - scientific_name: X\n    common_name: x\n    occurrence_ids: [1]\n    phenology_window: 1-2\nfigures:\n  - src: f.jpg\n    alt: an alt text here\ngeology_terms: [loess]\ngbif_query_hash: xxxxxxxxxx\n---\n\n"
        # treatment voice: SHARED heading grammar + glossary terms used twice;
        # control voice: different headings, no glossary terms, ragged paragraphs.
        # (live-tested: pass-1's fixtures were too weak to move the metrics —
        # both arms normalized to the same entropy/adoption; r2)
        def t_page(n):
            return FM % n + (
                "# Shared Voice %s\n\n## What to watch for\n\n"
                "The Pennsylvanian bedrock frames this reach. Pennsylvanian "
                "again, as the glossary asks.\n\n## When to come back\n\n"
                "Phenology returns twice a year here — phenology is the "
                "glossary word for it. Loess underfoot; loess above the "
                "ledges.\n" % n)
        def c_page(n):
            # drifting writers: DIFFERENT section grammar per page, no
            # glossary terms, ragged paragraph lengths
            head = ("# An Entirely Different Sort of Page, Honestly %d\n\n"
                    "## Section Alpha %d\n\n"
                    "No shared vocabulary at all in this body whatsoever friends.\n\n"
                    % (n, n))
            mid = " ".join(["padding"] * (40 + 25 * n)) + "\n\n"
            tail = ("### Nested Beta %d\n\n" % n) + \
                   " ".join(["more padding"] * (10 + 5 * n)) + "\n"
            return FM % n + head + mid + tail
        iroot = os.path.join(fx, "identical")
        for arm in ("treatment", "control"):
            for sub, n in (("a", 1), ("b", 2)):
                d = os.path.join(iroot, "pages", arm, sub)
                os.makedirs(d, exist_ok=True)
                open(os.path.join(d, "page.md"), "w").write(t_page(n))
        r_ident = measure(root=iroot)
        for m in r_ident["metrics"]:
            if m["metric"] != "paragraph_cv_ratio":
                assert abs(m["delta"]) < 1e-9, \
                    f"identical sets must yield zero delta ({m['metric']})"
            else:
                assert abs(m["delta"] - 1.0) < 0.05, \
                    "identical sets must yield CV ratio ~1.0"
        divroot = os.path.join(fx, "divergent")
        for arm, pagefn in [("treatment", t_page), ("control", c_page)]:
            for sub, n in (("w1", 1), ("w2", 2)):
                d = os.path.join(divroot, "pages", arm, sub)
                os.makedirs(d, exist_ok=True)
                open(os.path.join(d, "page.md"), "w").write(pagefn(n))
        r_div = measure(root=divroot)
        m_he = next(m for m in r_div["metrics"] if m["metric"] == "grammar_agreement")
        m_ga = next(m for m in r_div["metrics"] if m["metric"] == "glossary_adoption")
        m_cv = next(m for m in r_div["metrics"] if m["metric"] == "paragraph_cv_ratio")
        assert m_he["delta"] > 0.5 and m_ga["delta"] > 0.3 and m_cv["delta"] > 0.5, \
            "divergent fixtures must produce large deltas — the suite cannot discriminate"
        shutil.rmtree(fx, ignore_errors=True)
        print("DRIFT SELFTEST PASS: identical->zero, divergent->large")

    if __name__ == "__main__":
        ap = argparse.ArgumentParser()
        ap.add_argument("--selftest", action="store_true")
        ap.add_argument("--run", action="store_true")
        ap.add_argument("--out")
        a = ap.parse_args()
        if a.selftest:
            selftest()
        elif a.run:
            assert a.out, "--run needs --out"
            thr = os.path.getmtime("thresholds.yaml")
            for p in glob.glob("pages/*/*/page.md"):
                assert os.path.getmtime(p) > thr, \
                    f"{p} predates thresholds.yaml — pre-registration violated"
            rep = measure()
            rep["pair_analysis"] = pair_analysis()
            json.dump(rep, open(a.out, "w"), indent=2)
            print("DRIFT REPORT: %s (n=%d/%d treatment, %d/%d control)" % (
                a.out, rep["arms"]["treatment"]["n"], rep["arms"]["treatment"]["n_written"],
                rep["arms"]["control"]["n"], rep["arms"]["control"]["n_written"]))
        else:
            ap.error("choose --selftest or --run")
    PEOF
