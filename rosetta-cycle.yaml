# rosetta-cycle.yaml
#
# The Rosetta cycle — discover AND prove in one score, each path a bounded
# loop, the two paths running side by side.
#
# This merges the-rosetta-score.yaml (DISCOVER: six expeditions, collision,
# draft corpus, adversarial review, final corpus) and rosetta-prove.yaml
# (PROVE: select a pattern, decompose, architect, compose a proof score,
# adversarial review, revise). The two used to hand off through a cross-score
# `on_success: run_job` chain. Here each path is a `sheet.loops` span that
# repeats a set number of passes, and the hand-off is the permanent corpus on
# disk: discover writes `{{ score_dir }}/INDEX.md`, `patterns/` and
# `selection-guide.md`; prove reads them. Prove never reads discover's
# workspace, so the prove loop does not wait for the discover loop.
#
# The corpus is the vocabulary. The proof scores are the grammar.
# Together they prove that orchestration has a universal language.
#
# Patterns it uses:
#   - Two independent pipelines in one score (no dependency across them)
#   - Bounded loops (`sheet.loops`, `count`, loop index in every artifact path)
#   - Double fan-out (6 expeditions + 3 adversarial reviewers, twice)
#   - Data-driven lenses (voices / reviewers dicts drive per-instance prompts)
#   - Adversarial quality gates (draft → attack → revise)
#   - Staged fail-fast validations
#   - Vendor-diverse review (one `reviewer` alias, `select: [spread]`)
#   - Workspace archival (history preserved across runs)
#
#   DISCOVER LOOP (movements 1-6, sheets 1-13)      PROVE LOOP (movements 7-12, sheets 14-21)
#   repeats discover_passes times                    repeats prove_passes times
#
#   M1  The Question (sheet 1)                       M7  Pattern Selection (sheet 14)
#        |                                                |
#   M2  Six Expeditions x6 (sheets 2-7)               M8  Problem Decomposition (sheet 15)
#        |                                                |
#   M3  The Collision (sheet 8)                       M9  Score Architecture (sheet 16)
#        |                                                |
#   M4  Draft Corpus (sheet 9)                        M10 Score Composition (sheet 17)
#        |                                                |
#   M5  Adversarial Review x3 (sheets 10-12)          M11 Adversarial Review x3 (sheets 18-20)
#        |                                                |
#   M6  Final Corpus (sheet 13)                       M12 Revision + Validation (sheet 21)
#        |  writes INDEX.md / patterns/ ----reads---->    |  writes proof-scores/<slug>.yaml
#        v                                                v
#   [loop: next discover pass]                        [loop: next prove pass]
#
# Each pass writes into its own workspace subdirectory
# (`discover-pass-<n>/`, `prove-pass-<n>/`), so pass 2 never overwrites
# pass 1 and both passes stay inspectable after the run.
#
# Known race (accepted, same shape as the original pair running as separate
# jobs): a prove sheet may inject `INDEX.md` while a discover Final Corpus
# sheet is rewriting it. The prove prompts tell the musician to re-read an
# index that looks truncated.
#
# Usage:
#   mzt run scores/rosetta-corpus/rosetta-cycle.yaml --fresh
#   mzt status rosetta-cycle --watch
#   cat scores/rosetta-corpus/archive/rosetta-corpus.md   # Read corpus
#   ls scores/rosetta-corpus/proof-scores/                 # Read proofs

name: "rosetta-cycle"
description: "Discover orchestration patterns and prove them by composition — two bounded loops in one score, running side by side"

# Workspace auto-derives to ~/workspaces/rosetta-cycle (#58); the corpus and
# the proof scores live under {{ score_dir }} and survive archival.

instrument: claude-code
instrument_config:
  timeout_seconds: 3600
instrument_fallbacks: [codex-cli]

# Vendor-diverse adversarial reviewers — independence by construction: one
# `reviewer` alias whose chain holds three vendor families at the MODEL level,
# and `spread` gives each fan-out voice a different head (three reviewers,
# three models, no agreement by shared blind spot); the chain's other entries
# are that voice's fallbacks. (A claude-code reviewer would not add diversity
# here: this host's claude-code routes through the Z.AI gateway, i.e. GLM under
# an Anthropic-compatible interface.) Models refreshed 2026-09-04 against the
# live CLIs: gemini-3.8-flash (agy 1.1.26), gpt-5.6 (codex), glm-5.3 (plan).
# `spread` counts uses per movement, so movement 5 and movement 11 each get
# the full Google / OpenAI / Z.AI rotation.
instruments:
  reviewer:
    chain:
      - profile: antigravity
        config: {model: gemini-3.8-flash-high}
      - profile: codex-cli
        config: {model: "gpt-5.6-sol"}
      - profile: opencode
        config: {model: "zai-coding-plan/glm-5.3"}
    select: [spread]
    config:
      timeout_seconds: 3600

# Fan-out survival: repeated instrument failures open the circuit instead of
# cascading through every remaining sheet. Carried from both originals;
# `circuit_breaker` is a reserved score key (V327 warns, as it does for them).
circuit_breaker:
  enabled: true
  failure_threshold: 5
  recovery_timeout_seconds: 600

workspace_lifecycle:
  archive_on_fresh: true
  max_archives: 10

movements:
  # ── Discover ──
  1:
    name: "The Question"
  2:
    name: "Six Expeditions"
  3:
    name: "The Collision"
  4:
    name: "Draft Corpus"
  5:
    name: "Corpus Review"
  6:
    name: "Final Corpus"
  # ── Prove ── (rosetta-prove ran its sheets at 7200 s; the discover sheets
  # keep the root 3600 s. The reviewer alias carries its own 3600 s.)
  7:
    name: "Pattern Selection"
    instrument_config:
      timeout_seconds: 7200
  8:
    name: "Problem Decomposition"
    instrument_config:
      timeout_seconds: 7200
  9:
    name: "Score Architecture"
    instrument_config:
      timeout_seconds: 7200
  10:
    name: "Score Composition"
    instrument_config:
      timeout_seconds: 7200
  11:
    name: "Proof Review"
  12:
    name: "Revision + Validation"
    instrument_config:
      timeout_seconds: 7200

sheet:
  size: 1
  total_items: 12
  # Stage 2 → sheets 2-7, stage 5 → sheets 10-12, stage 11 → sheets 18-20.
  fan_out:
    2: 6
    5: 3
    11: 3
  # Review voices on both paths: the `reviewer` alias spreads
  # Google / OpenAI / Z.AI across the three voices of each review movement.
  # instrument_map is keyed by CONCRETE sheet numbers (after fan-out).
  instrument_map:
    reviewer: [10, 11, 12, 18, 19, 20]
  # Two independent chains. Stage 7 has NO dependency on stage 6: prove reads
  # the committed corpus under {{ score_dir }}, not discover's workspace, so
  # the two loops start together and run side by side.
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
    12: [11]
  # Bounded loops. Spans name STAGES (expanded to sheets 1-13 and 14-21 at
  # load). `count` is an exact pass count; it takes an int, not a template,
  # so the number is written here as a literal — prompt.variables
  # `discover_passes` / `prove_passes` carry the same authored value for the
  # prompts ("pass N of M") and must be kept equal to these counts.
  loops:
    1-6:
      index: discover_pass
      count: 2            # == prompt.variables.discover_passes
      max_iterations: 2   # belt and braces: never more than the authored count
    7-12:
      index: prove_pass
      count: 2            # == prompt.variables.prove_passes
      max_iterations: 2
  # The prove path gets the corpus index, forces, and selection guide as
  # context on every one of its sheets (rosetta-prove used a score-wide
  # prelude; here it is scoped to sheets 14-21 so the discover expeditions do
  # not carry ~90 KB of index they never asked for). Keys are CONCRETE sheets.
  cadenzas:
    14: &prove_context
      - file: "{{ score_dir }}/INDEX.md"
        as: context
        required: true
      - file: "{{ score_dir }}/forces.md"
        as: context
        required: true
      - file: "{{ score_dir }}/selection-guide.md"
        as: context
        required: true
    15: *prove_context
    16: *prove_context
    17: *prove_context
    18: *prove_context
    19: *prove_context
    20: *prove_context
    21: *prove_context

# Both loops are live at once: sheet 1 and sheet 14 are ready on the first
# tick. the-rosetta-score ran 2 wide, rosetta-prove 3 wide; 3 keeps one
# slot for the other path while a fan-out is in flight.
parallel:
  enabled: true
  max_concurrent: 3

# lookback 8 (the-rosetta-score's): sheet 8 reads back to sheet 1 (all six
# expeditions), sheet 13 back to sheet 5 (all three reviews). The prove
# templates never read previous_outputs. capture_files is kept from the
# original with the per-pass directories; no template references
# previous_files, so it is inert there as it was in the original.
cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 8000
  lookback_sheets: 8
  capture_files:
    - "{{ workspace }}/discover-pass-*/*.md"

# rosetta-prove's (the more lenient of the two; retry is score-wide).
retry:
  max_retries: 2
  base_delay_seconds: 60

# rosetta-prove's idle bound; the composition sheets are the longest.
stale_detection:
  enabled: true
  idle_timeout_seconds: 3600

prompt:
  variables:
    # ─── PASS COUNTS ───
    # Authored values of sheet.loops.1-6.count and sheet.loops.7-12.count.
    # Loops take an int literal, so these are the prompts' copy; keep equal.
    discover_passes: 2
    prove_passes: 2

    # ─── PERMANENT LOCATIONS ───
    # The corpus lives outside the workspace and survives archival.
    # Each pass reads it, adds to it, writes it back.
    # {{ score_dir }} anchors every reference to this score's own directory —
    # the corpus root. Portable across clone locations.
    corpus_path: "{{ score_dir }}/archive/rosetta-corpus.md"

    # ─── SCORE DIRECTORIES ───
    # The expeditions scan these for existing scores. Multiple dirs
    # so the score sees both public examples and the broader collection.
    score_dirs:
      - "{{ score_dir }}/../../examples"
      - "{{ score_dir }}/proof-scores"

    # Where proof scores land — the prove loop writes here, the discover loop
    # reads here to avoid re-proving.
    proof_output_dir: "{{ score_dir }}/proof-scores"
    proof_scores_dir: "{{ score_dir }}/proof-scores"

    # Decomposed corpus — individual pattern files for targeted reading.
    # The discover loop curates these; the prove loop selects from them.
    corpus_index: "{{ score_dir }}/INDEX.md"
    corpus_patterns_dir: "{{ score_dir }}/patterns"
    corpus_forces: "{{ score_dir }}/forces.md"
    corpus_selection_guide: "{{ score_dir }}/selection-guide.md"

    # ─── THE QUESTION ───
    question: |
      Is there a universal language of orchestration?

      When independent agents must coordinate to produce an outcome none
      could reach alone — when the work must be decomposed, distributed,
      and recomposed — does every domain reinvent the wheel? Or is there
      a shared grammar, a set of structural moves that appear everywhere
      because they are necessities of coordinated intelligence itself?

    # ─── MZT'S FULL TOOLKIT ───
    # Everything the expeditions can translate patterns INTO.
    primitives: |
      **Execution units:** sheet (one task, one agent), stage (group of
      sheets), movement (named major phase — movements: YAML key gives
      each movement a name visible in `mzt status`), score (complete
      job), concert (multi-score orchestration)

      **Coordination:** fan-out (N parallel instances, stagger_delay_ms
      staggers launches to reduce rate-limit surges), fan-in (convergence
      with skipped_upstream variable for graceful degradation),
      dependencies (DAG ordering), skip_when (conditional sheet skipping
      based on file/command checks), shared workspace artifacts

      **Communication:** previous_outputs (stdout forwarding), capture_files
      (file content forwarding), cross_sheet config (auto_capture_stdout,
      max_output_chars, lookback_sheets — fine-grained context control),
      workspace files (persistent shared state), cadenza injection
      (conductor adds context mid-run), prelude injection (task-specific
      context before the work)

      **Quality:** validations (file_exists, content_contains, content_regex,
      file_modified, command_succeeds, path_in_scope, field_match,
      file_sha256, csv_unique_key), quality gates (verification-only
      stages), adversarial review stages, staged fail-fast (coarse before
      fine), conditional validations (per-sheet or per-stage conditions).
      Grounding: guidance surfaces in validation feedback
      (grounding_guidance in the baton state) but full source-verification
      hooks are NOT a complete primitive — never advertise grounding as
      one; patterns needing it go to Awaiting Primitives

      **Lifecycle:** sheet.loops (bounded do-while over a sheet span:
      count, until expression over workspace file facts, max_iterations,
      cost_limit_usd — THIS score uses two), sheet.triggers (on_success /
      on_fail actions: goto, skip, pause, escalate, run, concert),
      on_success chains (score→score), self-chaining (score loops to
      itself with fresh state), workspace archival (history preserved),
      max_chain_depth (safety), learning inheritance (patterns flow
      across iterations), concert mode

      **Instrument assignment:** per-sheet instrument override (each sheet
      can use a different AI backend), instrument_map (batch-assign
      instruments to sheet ranges), movement-level instrument defaults,
      instrument_config.model (override the model within an instrument),
      alias chains with select modifiers (spread / cycle / cheapest /
      widest / balance — one alias, several vendors, built-in fallbacks),
      mixed-instrument scores where cheap instruments handle simple work
      and expensive instruments handle complex reasoning

      **Specification corpus:** spec_dir points to a directory of YAML
      specification files that get injected into agent context. spec_tags
      per-sheet filter which specs are relevant. Agents receive structured
      domain knowledge, not just prompts.

      **Conductor support:** sheet descriptions (per-sheet status labels),
      hook variables ({workspace}/{job_id}/{job_status}/{score_dir} in
      hook commands), score logging (schema-level; conductor-unconsumed),
      AI judgment (FERMATA auto-resolution, opt-in), schedule pinning
      (byte-digest admission), structured output (response_format
      json_object/json_schema). Gap-report additions 2026-10-20.

      Gap-report additions (2026-10-21, inventory-verified):
      instrument_supervision (profile-only descendant supervision, environment and I/O/startup bounds);
      profile_code_mode (schema-only typed interfaces; unwired, distinct from score code_execution);
      scratch_lifecycle (MARIANNE_SCRATCH; terminal cleanup by default, keep opt-in);
      checkpoint_persistence (durable registry sheet/flow/variable state; no mid-sheet transactions);
      ai_review (reserved V327 block; explicit review sheets supply live review);
      flow_expressions (variables, loop/sheet state and workspace file facts in until expressions);
      trigger_concert (non-waiting per-attempt child submission; parent-score-relative paths);
      validate_suppress (known WARN/INFO acknowledgements; unknown/ERROR codes fail V012);
      fleet (separate type: fleet roster and dependency-ordered groups; single-host orchestration);
      failure_history (recent other-sheet validation evidence in wrapped prompts; raw omits it).

      **Agent tools:** vary by instrument profile — harness instruments
      (claude-code, codex-cli, goose) carry their own tool suites
      (Read/Write/Edit/Grep/Bash/WebSearch/subagents); custom CLI
      instruments carry exactly the tool they wrap. Check the profile,
      never assume a specific toolset.

      **Prompting patterns:** outcome-focused (describe destination, not
      route), data-driven lenses (lookup dicts drive per-instance behavior),
      macros (reusable prompt blocks), synthesis prompts (convergence +
      tension + emergence, never summary), conditional stage logic (Jinja2
      if/elif), loop-driven generation (for loops over data structures),
      filter chains (transform data inline)

      **Score architecture tiers:** pipeline (sequential), fan-out +
      synthesis, concert chain (scores triggering scores), self-chain
      loop (iterative improvement), bounded in-score loop (sheet.loops),
      complex investigation (dual-phase, double fan-out, adversarial review)

      **Instruments — plugin profiles, any CLI (verified 2026-09-03):**
      - claude-code (Anthropic; strong reasoning, tool use)
      - codex-cli (OpenAI; gpt-5.5 class), opencode (Z.AI coding plan;
        GLM 5.x), goose (Z.AI), antigravity (Google's Gemini successor —
        gemini-cli is DEAD, sunset to Antigravity; never assign it)
      - ollama (local models), aider, cline-cli, crush
      - Custom CLI instruments: wrap ANY tool as a profile —
        pandoc, ffmpeg, curl, pytest, git, scrapers, DB query tools
      - Mixed-instrument scores: big-context instruments for research,
        strong reasoners for implementation, local/cheap for bulk work,
        custom instruments for non-AI tasks
      - A score isn't just AI agents talking. It's AI + scripts +
        tools + verification + deployment, all wired by the conductor.

    # ─── EXISTING VOCABULARY ───
    existing: |
      **Named within-stage fan-out patterns (8):**
      adversarial, perspectival, functional, graduated, generative,
      mosaic, translational, phenomenological

      **Named score-level patterns (5 tiers):**
      pipeline, fan-out+synthesis, concert chain, self-chain loop,
      complex investigation (dual-phase, double fan-out)

      **The corpus has 56 named patterns** across 10 generative forces,
      11 generators, and 12 cross-domain convergences. 6 proof scores
      exist in examples/rosetta/. Patterns range from beginner (Fan-out
      + Synthesis, Shipyard Sequence, The Tool Chain) to advanced (CEGAR
      Loop, Saga Compensation Chain, Lines of Effort).

      **New capabilities since last accounting (2026-09-03) that patterns should USE:**
      - score_dir anchor ({{ score_dir }} in prompts/preludes, {score_dir} in
        validations and hooks) — machine-portable repo file references
      - Relative run_job job_path (anchors to the submitting score's dir)
      - Per-sheet instrument assignment + instrument_map (mixed-instrument,
        vendor-diverse review — see this score's movements 5 and 11)
      - per_sheet_fallbacks with EMPTY chains for deterministic sheets
        (a cli gate must never inherit an AI fallback that reinterprets it)
      - on_failure durable hooks (terminal-failure custody, restart-safe)
      - schedule: recurring execution with durable leases across restarts
      - max_wall_seconds (whole-job wall deadline)
      - circuit_breaker (fan-out failure isolation; this score uses it)
      - cost_limits (spend ceilings per run)
      - isolation: git worktree isolation for parallel writers
      - Techniques ECS (skill/mcp/protocol components resolved per sheet)
      - Directory cadenzas (inject a whole curated directory as context)
      - required: true cadenza attachments (fail-closed on missing context)
      - Auto-derived workspaces (omit workspace: → ~/workspaces/<name>, #58)
      - skip_when, stagger_delay_ms, cross_sheet control, named movements
      - mzt recover / resolve / --escalation recovery flows
      - sheet.loops bounded in-score loops and sheet.triggers (this score
        runs its discover and prove paths as two concurrent bounded loops)

      **Primitive coverage refresh (2026-09-04, source-verified):**
      - prompt_extensions: global directives, then expanded-sheet directives
      - self_healing: HEALING baton state after retry exhaustion; diagnosis and
        re-dispatch via the healing coordinator (--self-healing/--escalation)
      - interactive_mode: profile-default/forced interactive/headless + nudges
      - mcp_shared_pool: daemon-shared MCP processes for active techniques
      - bridge: accepted proxy/hybrid config, currently conductor-unconsumed
      - code_execution: opt-in classified blocks; require_sandbox fails closed
      - sheet_pacing: pause_between_sheets_seconds between serial successes
      - relative_workspace_anchor: score-file parent vs string-load process CWD
      - state_backends: score json/sqlite model; live conductor registry is SQLite
      - entropy_response: modeled per score, live health loop does not consume it
      - learning_auto_apply: trust-aware config, not honored by live injection yet
      - agent_card: in-process A2A discovery/routing, not restart-persistent
      - runtime_variables: repeated mzt run --var overrides, persisted on resume
      - cli_pause: graceful sheet-boundary pause; --force cancels
      - cli_resume: durable resume; --from-sheet resets the later cascade
      - cli_modify: validate, pause, replace config, optionally resume
      - cli_cancel: immediate mid-sheet cancellation
      - clear_rate_limits_cli: clear limits and redispatch WAITING sheets
      - prompt_preflight: daemon token warning/error thresholds; zero disables

      **Primitive coverage gap-report additions (2026-10-20, source-verified):**
      - sheet_descriptions: per-sheet status labels keyed by expanded sheet number
      - hook_variables: {workspace}/{job_id}/{job_status}/{score_dir} expansion
      - score_logging: score schema only; conductor-unconsumed
      - judgment: opt-in AI resolution of escalated FERMATA sheets
      - schedule_pinning: pin_source_digest refuses byte/identity drift per tick
      - structured_output: response_format json_object/json_schema per scope

      **Primitive coverage gap-report additions (2026-10-21, inventory-verified):**
      - instrument_supervision (profile-only descendant supervision, environment and I/O/startup bounds)
      - profile_code_mode (schema-only typed interfaces; unwired, distinct from score code_execution)
      - scratch_lifecycle (MARIANNE_SCRATCH; terminal cleanup by default, keep opt-in)
      - checkpoint_persistence (durable registry sheet/flow/variable state; no mid-sheet transactions)
      - ai_review (reserved V327 block; explicit review sheets supply live review)
      - flow_expressions (variables, loop/sheet state and workspace file facts in until expressions)
      - trigger_concert (non-waiting per-attempt child submission; parent-score-relative paths)
      - validate_suppress (known WARN/INFO acknowledgements; unknown/ERROR codes fail V012)
      - fleet (separate type: fleet roster and dependency-ordered groups; single-host orchestration)
      - failure_history (recent other-sheet validation evidence in wrapped prompts; raw omits it)

      **Practiced patterns from real scores:**
      - Verification loop (style-ghost: 23 sheets, triple fan-out)
      - Swarm (v3 orchestra: 706 sheets, 32 equal peers)
      - Evolution cycle (RLF: 39 iterations, identity persistence)
      - Company-in-a-box (backyard-capitalism-9000: persona agents)
      - Production pipeline (viral-clip-extractor: parallel modules)
      - Archaeological dig (workspace-archaeology: 28 sheets, dual-LLM)
      - Wordware demos (4): contract-gen, candidate-screening, marketing-content, invoice-analysis
      - Rosetta proofs (6): immune-cascade, dead-letter-quarantine, echelon-repair, prefabrication, source-triangulation, shipyard-sequence

      **Check the permanent corpus** at the path given in Stage 1.
      If previous passes have already discovered patterns, DON'T
      rediscover them. Go deeper. Go sideways. Find what's missing.
      Focus on patterns that USE the new capabilities — especially
      mixed-instrument, spec corpus, and grounding hooks.

    # ─── CROSS-DOMAIN SEED ───
    # Starting translations. The expeditions go DEEPER than this.
    cross_domain_seed: |
      Known cross-domain equivalences (starting points, not answers):

      Fan-out = scaffolding multiple floors = cell division = orchestral
      sections = flanking maneuver = multiple POV = catalytic branching

      Dependencies = foundation→walls→roof = gene cascade = harmonic
      progression = supply chain = cause→effect = reaction prerequisites

      Shared artifacts = construction drawings = pheromone trails =
      the score on the stand = intelligence reports = intermediates

      Self-chain = kaizen = cell cycle = practice loop = revision cycle
      = OODA loop = autocatalysis

      Quality gate = occupancy permit = developmental checkpoint =
      dress rehearsal = peer review acceptance = purity threshold

      Adversarial review = third-party inspection = immune surveillance
      = red team = literary critic = independent verification

      These show WHERE translations exist. The expeditions find the
      patterns these translations CONTAIN — the structural moves that
      the cross-domain equivalences are evidence OF.

    # ─── SIX WAYS OF KNOWING ───
    voices:
      1:
        name: "the-builder"
        title: "The One Who Builds"
        voice: |
          You think in sequences that bear weight. Foundation before walls.
          Walls before roof. Not because someone decided — because gravity
          decided. You know what a load-bearing dependency is because you've
          seen what happens when it's violated.

          Construction, bridges, ships, circuits, barn raisings, cathedral
          generations, IKEA instructions. The wisdom is in the sequence.
          The pattern is in the dependency.

          Find orchestration patterns in how things get ASSEMBLED.

      2:
        name: "the-gardener"
        title: "The One Who Grows"
        voice: |
          You think in seasons and soil. Some things cannot be rushed.
          Your job is not to make it ripen — it's to create the conditions
          where ripening can happen.

          Ecosystems, mycorrhizal networks, succession, fermentation,
          composting, immune systems, parenting. Any work where you
          cannot force the outcome, only tend.

          Find orchestration patterns in how things GROW.

      3:
        name: "the-dancer"
        title: "The One Who Moves"
        voice: |
          You think in bodies and timing. Not abstract time — felt time.
          The murmuration that turns without a signal. The jazz section
          that locks in. The surgical team handing instruments without words.

          Choreography, counterpoint, fugue, polyrhythm, kitchen
          choreography, basketball plays, traffic flow.

          Find orchestration patterns in how bodies and voices
          COORDINATE IN TIME.

      4:
        name: "the-reasoner"
        title: "The One Who Proves"
        voice: |
          You think in structure and necessity. A proof is an orchestration
          — lemmas building toward a theorem, each independently verifiable.

          State machines, type systems, constraint satisfaction, game theory,
          Byzantine consensus, MapReduce, the actor model.

          Find orchestration patterns in FORMAL STRUCTURE.

      5:
        name: "the-commander"
        title: "The One Who Commands"
        voice: |
          You think in fog and decision. Information incomplete, time short,
          stakes real. The plan never survives contact. The question is
          what survives the plan's failure.

          Mission command, commander's intent, triage, incident response,
          design reviews, red team / blue team, the Delphi method.

          Find orchestration patterns in COORDINATION UNDER PRESSURE.

      6:
        name: "the-storyteller"
        title: "The One Who Tells"
        voice: |
          You think in tension and resolution. Every story is an
          orchestration — characters converging toward a moment the
          reader can feel approaching.

          Three-act structure, kishotenketsu, the Socratic method,
          the dialectic, the Talmudic page, peer review.

          Find orchestration patterns in how MEANING ACCUMULATES.

    # ─── THREE ADVERSARIAL REVIEWERS (corpus, movement 5) ───
    corpus_reviewers:
      1:
        name: "the-practitioner"
        title: "The Practitioner"
        attack: |
          You compose Marianne scores. For every pattern: can I build a
          score from this description in under 10 minutes? Are the stages
          concrete? Is the fan-out specified? Do the validations verify
          outcomes, not just process? If you can't compose from it,
          it's not concrete enough.
      2:
        name: "the-skeptic"
        title: "The Skeptic"
        attack: |
          You don't trust convergence. When two patterns are called "the
          same structure in different materials" — are they really? What
          is the STRUCTURAL identity? Same fan-out count, same dependency
          graph, same communication mechanism? Remove the metaphorical
          language. Does the equivalence survive?
      3:
        name: "the-newcomer"
        title: "The Newcomer"
        attack: |
          You've never used Marianne. Would someone who just installed it
          understand these patterns? Is the "When to Use" clear enough
          to recognize in practice? Are the examples from domains a
          real user might work in? If it assumes expertise, it fails.

    # ─── THE INSTRUMENT UNIVERSE (prove) ───
    instrument_categories: |
      Any CLI tool, API client, or scriptable interface is a mzt instrument.
      This list is not exhaustive — it's a starting point to break you out of
      "everything is an LLM" thinking. The real world has thousands of tools.
      Reach for them.

      **AI Agents:** claude-code, codex-cli (gpt-5.6), opencode (Z.AI GLM
      5.x), goose, antigravity (Google; gemini-cli is DEAD, sunset to
      Antigravity), ollama (local), aider, cline-cli, crush
      **Creative — Visual:** DALL-E API, Midjourney API, Stable Diffusion, Flux, Leonardo.ai, Canva API, Figma API, ImageMagick, ffmpeg (thumbnails, composites)
      **Creative — Audio:** ElevenLabs (voice synthesis), Bark (TTS), Whisper (transcription), ffmpeg (audio processing), sox, Spotify API (metadata)
      **Creative — Video:** Runway, Sora, ffmpeg (editing, encoding, format conversion), yt-dlp (research)
      **Creative — 3D:** Meshy, Tripo, Blender CLI, OpenSCAD
      **Creative — Text:** LaTeX (typesetting), Pandoc (format conversion), Calibre (ebook), mdbook/mkdocs/docusaurus (doc sites), Hugo/Jekyll (static sites), Asciidoctor
      **Financial:** Stripe CLI (payments, subscriptions, invoicing), Plaid (banking), Wise API (international transfers), currency APIs, crypto APIs, QuickBooks API, invoice generators
      **Communication:** Twilio (SMS, voice, video), SendGrid/Mailgun (email), Slack API, Discord webhooks, Telegram Bot API, Matrix/Element, XMPP, RSS feed generators, Mailchimp API
      **Social/Publishing:** GitHub CLI (repos, issues, PRs, releases, pages), npm publish, PyPI upload, crates.io, Docker Hub, Twitter/X API, LinkedIn API, Reddit API, Medium API, dev.to API, WordPress API, Ghost API
      **Data — Collection:** curl, wget, scrapy, Playwright (browser automation), Puppeteer, public APIs (weather, census, financial, academic), web scraping frameworks, RSS/Atom parsers
      **Data — Processing:** pandas (via Python scripts), jq, csvkit, sqlite3, DuckDB CLI, Apache Arrow, sed/awk (stream processing), sort/uniq/cut (Unix pipes)
      **Data — Storage:** SQLite, PostgreSQL (psql), MySQL, Redis CLI, MongoDB (mongosh), S3 CLI (aws s3), MinIO, Elasticsearch
      **Data — Analysis:** R (Rscript), Jupyter (papermill), Matplotlib/Seaborn (via Python), gnuplot, Wolfram Alpha API, statistical APIs
      **Infrastructure — Cloud:** AWS CLI, gcloud, az (Azure), Terraform, Pulumi, CloudFormation, Ansible, Chef, Puppet
      **Infrastructure — Containers:** Docker, docker-compose, Podman, Kubernetes (kubectl, helm), k3s, Buildpacks
      **Infrastructure — Networking:** nginx configs, Caddy, HAProxy, Cloudflare CLI (wrangler), DNS APIs (Route53, Cloudflare), Let's Encrypt (certbot)
      **Infrastructure — Deployment:** Vercel CLI, Netlify CLI, Fly.io (flyctl), Railway, Render, Heroku, Deno Deploy, Cloudflare Workers (wrangler)
      **Monitoring/Observability:** Datadog, Grafana API, Prometheus, PagerDuty, OpsGenie, Sentry, LogDNA, New Relic, healthcheck.io, UptimeRobot API
      **Security:** Bandit, Semgrep, Trivy, Snyk CLI, OWASP ZAP, nmap, OpenSSL, age (encryption), GPG, HashiCorp Vault
      **Testing/Validation:** pytest, npm test, jest, mocha, cargo test, go test, curl + jq (API testing), Postman/Newman CLI, k6 (load testing), Lighthouse CLI (web perf), Pa11y (accessibility), linkchecker
      **Project Management:** GitHub Issues/Projects, Linear API, Jira CLI, Notion API, Trello API, Asana API, Todoist API
      **Document/Knowledge:** Notion API, Confluence API, Google Docs API, Airtable API, Coda API
      **Geographic/Mapping:** Google Maps API, OpenStreetMap/Nominatim, Mapbox, geopy, geojson tools
      **Scientific:** Biopython, RDKit (chemistry), BLAST (genomics), ArXiv API, Semantic Scholar API, PubMed API, NASA APIs, USGS APIs
      **Legal:** CourtListener API, legal document parsers, contract analysis tools, regulatory APIs
      **Education:** LMS APIs (Canvas, Moodle), quiz generators, Anki deck builders, curriculum formatters
      **Physical/IoT:** MQTT clients, serial interfaces (pyserial), GPIO (RPi.GPIO), OPC-UA, Zigbee/Z-Wave controllers, Home Assistant API, ESPHome
      **Hardware/Manufacturing:** G-code generators (3D printing), CNC tool path generators, pick-and-place machine interfaces, OPC-UA (industrial automation)
      **Translation/Localization:** DeepL API, Google Translate API, i18n tooling (gettext, ICU), locale formatters
      **Calendar/Scheduling:** Google Calendar API, Calendly API, iCal generators, cron formatters

      Every one of these is wrappable as a mzt instrument profile (YAML + executable).
      The proof score must use at least 3 categories. The LLM is the coordinator, not the worker.
      Default to CLI instruments for deterministic work. Justify every stage that uses an LLM.

    # ─── THREE ADVERSARIAL REVIEWERS (proof, movement 11) ───
    proof_reviewers:
      1:
        name: "the-practitioner"
        title: "The Practitioner"
        attack: |
          You compose and RUN Marianne scores. For this proof score:

          Can I run it? Does every referenced instrument binary exist
          on a standard system? Does every validation actually test what
          its description claims — or is it cosmetic? Would I get a
          WORKING artifact at the end that I could point someone at and
          say "use this"? If the output is just markdown files in a
          directory, it fails.

          Check every `command_succeeds` — would the command actually
          succeed on a fresh workspace? Check every instrument — is it
          a real tool or a placeholder? Does the score produce something
          that EXISTS IN THE WORLD after execution, or just on disk?
      2:
        name: "the-skeptic"
        title: "The Skeptic"
        attack: |
          Strip the pattern labels from every stage comment. Look only
          at the actual stage structure, dependencies, fan-out, and
          instrument assignments.

          Is this genuinely the claimed pattern composition, or is it a
          sequential pipeline with pattern names in the comments? Does
          the force analysis in the architecture doc actually generate
          the pattern selection, or was the analysis written after the
          structure was already decided?

          Count the distinct instrument categories. If everything resolves
          to claude-code with a CLI wrapper, the instrument diversity is
          fake. Count the TDF domains. If every stage is COMP with
          SCI/CULT/EXP mentioned only in prose, the cross-domain claim
          is decorative.

          Are the validations testing OUTCOMES (did the deployed service
          respond?) or PROCESS (did the file appear)?
      3:
        name: "the-newcomer"
        title: "The Newcomer"
        attack: |
          I just installed Marianne. I cloned this repo. I ran
          `mzt run examples/rosetta/this-score.yaml`.

          Did I get what the header comment promised? Which API keys
          do I need? Are they documented in the header or do I discover
          them when stage 3 fails? Can I point this score at MY project
          by changing one variable, or is it hardcoded to a specific
          problem?

          Would running this score and reading its output teach me
          something about pattern composition I didn't know before?
          Or would I just see "another AI pipeline"?

          Is this score GENERIC — usable by someone who isn't the
          author — or is it a personal tool wearing a demo costume?

  template: |
    {# ── Pass scoping ──────────────────────────────────────── #}
    {# Movements 1-6 are the discover loop, 7-12 the prove loop. The
       conductor supplies the loop index as loops.<index>; every artifact
       of a pass lives in that pass's own directory so a later pass never
       overwrites an earlier one. #}
    {% if stage <= 6 %}
    {% set pass_no = loops.discover_pass %}
    {% set pass_total = discover_passes %}
    {% set pass_dir = workspace ~ "/discover-pass-" ~ pass_no %}
    {% else %}
    {% set pass_no = loops.prove_pass %}
    {% set pass_total = prove_passes %}
    {% set pass_dir = workspace ~ "/prove-pass-" ~ pass_no %}
    {% endif %}

    {# ── Macros ─────────────────────────────────────────────── #}
    {% macro pass_banner(path) %}
    **{{ path }} — pass {{ pass_no }} of {{ pass_total }}.** This pass's
    directory is `{{ pass_dir }}/` (create it with `mkdir -p` before writing).
    Every file this pass writes goes there. Earlier passes' directories are
    read-only history.
    {% endmacro %}

    {% macro output_spec(filename, min_words) %}

    ---
    **Output:** Save to `{{ pass_dir }}/{{ filename }}`
    **Length:** {{ min_words }}+ words
    {% endmacro %}

    {% macro quality_bar(level) %}
    {% if level == "high" %}
    Be thorough. Cite specifics. No hedging.
    {% elif level == "draft" %}
    Prioritize coverage. Mark uncertainties with [?]. This draft will be attacked.
    {% elif level == "adversarial" %}
    Be rigorous and unforgiving. Find every weakness. Name it.
    {% endif %}
    {% endmacro %}

    {% macro pattern_format() %}
    For each pattern (at least 6 — only real ones, not forced):

    ```
    PATTERN: [Name]
    SOURCE: [Where in your territory]
    SCALE: [within-stage | score-level | concert-level | communication | iteration | adaptation]

    THE DYNAMIC: [What makes this tick? One paragraph, in your voice.]
    WHEN IT LIVES: [What work does it serve?]
    WHEN IT DIES: [When does it fail?]

    THE SCORE:
    - Stages: [how many, what each does]
    - Fan-out: [where, how many]
    - Dependencies: [what waits for what]
    - Communication: [how agents share state]
    - Validations: [how you know it worked]

    AN EXAMPLE: [A concrete task outside your domain this would serve.]

    INSTRUMENTS:
    - Preferred: [which mzt instrument(s) and why]
    - Custom: [any non-AI instruments this pattern needs — CLI tools,
      scripts, APIs]
    ```
    {% endmacro %}

    {# ═══════════════════════════════════════════════════════════ #}
    {# DISCOVER LOOP — movements 1-6                               #}
    {# ═══════════════════════════════════════════════════════════ #}
    {% if stage == 1 %}
    # The Question

    {{ pass_banner("Discover") }}

    {{ question }}

