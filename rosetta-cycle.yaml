    Pass {{ pass_no - 1 }} already ran the full discover path and wrote its
    corpus into the permanent locations below. Read
    `{{ workspace }}/discover-pass-{{ pass_no - 1 }}/06-the-corpus.md` and
    its three reviews (`05-review-1.md` … `05-review-3.md`). Do not send
    the expeditions where pass {{ pass_no - 1 }} just went — send them where
    its reviewers said the corpus is thin, metaphorical, or unproven.
    {% endif %}

    ## Check for Existing Corpus

    Read `{{ corpus_path }}` if it exists. Perform a SYSTEMATIC gap analysis:

    1. **Count patterns per scale.** How many within-stage? Score-level?
       Concert-level? Communication? Iteration? Adaptation? Scales with
       fewer than 3 patterns are priority targets.
    2. **List domains explored.** Which of the six voices' territories
       have been mined? Which are thin? What domains OUTSIDE the six
       voices haven't been touched at all?
    3. **Check proof coverage.** Which patterns have proof scores? Which
       don't? Patterns without proofs are unverified — flag them.
    4. **Review flags.** What did previous adversarial reviews flag as
       weak, metaphorical, or underspecified? These need strengthening
       or cutting.
    5. **Instrument gaps.** How many patterns specify non-LLM instruments?
       How many use mixed-instrument strategies? How many include
       instrument fallback guidance? This dimension is likely underexplored.
    6. **Frontmatter completeness.** Do all patterns have structured YAML
       frontmatter (between `---` markers at the top of the file)?
       Frontmatter fields: name, scale, status, forces, generators,
       problem, signals, stages, dependencies, composes_with.
       Patterns without frontmatter need it — flag them for the final
       corpus stage to fix.
    7. **Composition DAG health.** Does
       `{{ corpus_index | replace('INDEX.md', 'composition-dag.yaml') }}`
       exist? If so, check for isolated patterns (no composition edges)
       and underconnected clusters.

